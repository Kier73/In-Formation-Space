name: TCR-002 authenticated receiver-resident tensor cut

on:
  pull_request:
    paths:
      - 'experiments/tensor_cut_realization/**'
      - '.github/workflows/tensor-cut-transit.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/tensor_cut_realization/**'
      - '.github/workflows/tensor-cut-transit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONPATH: external/E-CPU

jobs:
  protocol-tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install numpy jsonschema
      - name: Adversarial receiver-owned identity, cut, replay and oracle checks
        run: python -m unittest experiments.tensor_cut_realization.test_transit_tensor -v

  actual-local-mtls:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy jsonschema
      - name: Generate procedural 4-partition source
        run: python -m experiments.tensor_cut_realization.tensor_cut prepare --out prepared
      - name: Run separate mTLS listener processes, warm replay, receiver denial, E-CPU DAG
        run: python -m experiments.tensor_cut_realization.run_transit_local --prepared prepared --report tcr002-local.json
      - name: Assert evidence contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tcr002-local.json'))
          assert r['status']=='local-authenticated-tensor-cut-reconstructed'
          assert r['worker_count']==r['fresh_executions']==r['replayed_responses']==4
          assert r['receiver_denied_wrong_manifest'] is True
          assert r['verified_output']['status']=='passed' and r['dag_restored'] is True
          assert r['scope']['network']=='no inter-host route or Tailscale overlay tested'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tcr002-local-mtls-reconstruction
          path: tcr002-local.json
          if-no-files-found: error

  real-weights-local-mtls:
    needs: actual-local-mtls
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy jsonschema
      - name: Observe exactly four pinned GPT-2 MLP tensors
        run: python -m experiments.tensor_cut_realization.tensor_cut prepare --live --out prepared
      - name: Reuse independent subprocess mTLS test against observed real weights
        run: python -m experiments.tensor_cut_realization.run_transit_local --prepared prepared --report tcr002-real-weight-mtls.json
      - name: Assert real source not silently substituted
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tcr002-real-weight-mtls.json'))
          assert r['status']=='local-authenticated-tensor-cut-reconstructed'
          assert r['source_provenance']['kind']=='observed-selected-hub-payloads'
          assert r['source_provenance']['selected_payload_bytes']==18889728
          assert r['verified_output']['status']=='passed'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tcr002-real-weight-local-mtls-reconstruction
          path: tcr002-real-weight-mtls.json
          if-no-files-found: error
