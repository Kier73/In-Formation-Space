name: TPP-003 external observation and unit translation

on:
  push:
    paths:
      - "experiments/tactile-perception-observations/**"
      - ".github/workflows/tpp003-observations.yml"
  pull_request:
    paths:
      - "experiments/tactile-perception-observations/**"
      - ".github/workflows/tpp003-observations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile adapter
        run: python -m compileall -q experiments/tactile-perception-observations
      - name: Run offline conformance and adversarial tests
        run: python -m unittest discover -s experiments/tactile-perception-observations -p "test_*.py" -v

  real-public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Attempt two bounded public HTTPS observations
        run: python experiments/tactile-perception-observations/noaa_bridge.py --live --date recent > tpp003-live-report.json
      - name: Print result classification, not ungrounded success
        run: |
          python -c "import json; r=json.load(open('tpp003-live-report.json')); print('observation statuses:', [x['status'] for x in r['observations']]); print('cross-unit classification:', r['cross_unit_relation']['status']); print('matched:', r['cross_unit_relation'].get('matched_timestamps', 0))"
      - uses: actions/upload-artifact@v4
        with:
          name: tpp003-noaa-read-only-observation
          path: tpp003-live-report.json
