name: CGR-005 non-affine Ground quorum and native IPS-008 effect handoff

on:
  pull_request:
    paths:
      - 'experiments/resource-continuity-prefix/cgr005_general_quorum.py'
      - 'experiments/resource-continuity-prefix/cgr005_receiver_worker.py'
      - 'experiments/resource-continuity-prefix/test_cgr005_general_quorum.py'
      - 'experiments/resource-continuity-prefix/CGR-005.md'
      - '.github/workflows/cgr005-general-quorum-ips008.yml'
  push:
    branches:
      - research/cgr005-general-language-quorum-ips008
    paths:
      - 'experiments/resource-continuity-prefix/cgr005_general_quorum.py'
      - 'experiments/resource-continuity-prefix/cgr005_receiver_worker.py'
      - 'experiments/resource-continuity-prefix/test_cgr005_general_quorum.py'
      - '.github/workflows/cgr005-general-quorum-ips008.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  general-quorum-receiver:
    name: Verified NCR language through E-CPU majority and original IPS-008
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Pin original E-CPU quorum, DAG and mTLS effect receiver
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: e380070312b7553d8bd4860a460bb7b9dce7070a
          path: external/E-CPU
          persist-credentials: false
      - name: Pin independently verified NCR-004 operator language
        uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: b9b2beeaed1393c6375337b055611d5ccf816f89
          path: external/Navigable-Compute
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install original native implementations and test utilities
        run: |
          python -m pip install -e ./external/E-CPU
          python -m pip install -e ./external/Navigable-Compute
          python -m pip install 'pytest>=8,<9' 'jsonschema>=4,<5'
      - name: Execute native general Ground, original recovery and TLS regression
        shell: bash
        run: |
          export PYTHONPATH="$PWD/experiments/resource-continuity-prefix:$PWD/external/E-CPU:$PWD/external/E-CPU/tests:$PWD/external/Navigable-Compute"
          python -m pytest -q experiments/resource-continuity-prefix/test_cgr005_general_quorum.py
          python -m pytest -q experiments/resource-continuity-prefix/test_cgr004_language_hypervisor.py
          python -m pytest -q external/E-CPU/tests/test_effect_receiver_service.py
