name: Intervention transition conformance bridge

on:
  push:
    paths:
      - "bridges/observation-path/transition_conformance.py"
      - "bridges/observation-path/test_transition_conformance.py"
      - "bridges/observation-path/transition-conformance.schema.json"
      - "experiments/description-to-realization/trials/trial-08-intervention-aware-attention/intervention_attention.py"
      - ".github/workflows/intervention-transition-conformance.yml"
  pull_request:
    paths:
      - "bridges/observation-path/transition_conformance.py"
      - "bridges/observation-path/test_transition_conformance.py"
      - "bridges/observation-path/transition-conformance.schema.json"
      - "experiments/description-to-realization/trials/trial-08-intervention-aware-attention/intervention_attention.py"
      - ".github/workflows/intervention-transition-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Trial 08 planner and conformance bridge
        run: |
          python -m py_compile experiments/description-to-realization/trials/trial-08-intervention-aware-attention/intervention_attention.py
          python -m py_compile bridges/observation-path/transition_conformance.py
      - name: Validate transition conformance schema
        run: |
          python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
          python -c "import json, jsonschema; p='bridges/observation-path/transition-conformance.schema.json'; s=json.load(open(p, encoding='utf-8')); jsonschema.Draft202012Validator.check_schema(s)"
      - name: Run focused transition conformance tests
        run: python -m unittest discover -s bridges/observation-path -p 'test_transition_conformance.py' -v
