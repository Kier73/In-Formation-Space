name: CIG-016 proof-directed refinement
on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-016.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-016.yml'
  workflow_dispatch:
jobs:
  source-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: CIG regression
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python -m unittest discover -s . -p 'test_*.py' -q
      - name: Reproduce proof-directed campaign
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python run_proof_refinement.py --sizes 32 128 --output CIG-016-ci.json
