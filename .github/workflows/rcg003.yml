name: RCG-003 synthetic adaptive observer fabric
on:
  push:
    paths:
      - 'experiments/real_connectome_ground/continuity/**'
      - '.github/workflows/rcg003.yml'
  pull_request:
    paths:
      - 'experiments/real_connectome_ground/continuity/**'
      - '.github/workflows/rcg003.yml'
  workflow_dispatch:
jobs:
  synthetic-fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact synthetic training and separate-process local observer
        env:
          PYTHONPATH: experiments/real_connectome_ground:experiments/real_connectome_ground/continuity
        run: python -m unittest discover -s experiments/real_connectome_ground/continuity/adaptive_fabric -p 'test_*.py' -v
      - name: Train on real source topology and check held-out exact reference
        env:
          PYTHONPATH: experiments/real_connectome_ground:experiments/real_connectome_ground/continuity
        run: |
          python experiments/real_connectome_ground/continuity/adaptive_fabric/fabric_policy.py --train 18 --test 12 --seed 61 --output rcg003-study.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcg003-study-${{ matrix.python-version }}
          path: rcg003-study.json
          if-no-files-found: error
