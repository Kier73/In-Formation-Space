name: Operation path intervention

on:
  push:
    paths:
      - "experiments/operation-path-sensitivity/**"
      - "bridges/observation-path/operation_path_criticality.py"
      - "bridges/observation-path/operation_spans.py"
      - ".github/workflows/operation-path-intervention.yml"
  pull_request:
    paths:
      - "experiments/operation-path-sensitivity/**"
      - "bridges/observation-path/operation_path_criticality.py"
      - "bridges/observation-path/operation_spans.py"
      - ".github/workflows/operation-path-intervention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify analysis and evidence reconstruction
        run: python -m unittest discover -s experiments/operation-path-sensitivity -v
      - name: Measure seven blocks without timing pass thresholds
        run: python experiments/operation-path-sensitivity/intervention.py --output results/intervention.json
      - name: Reconstruct retained report in a fresh process
        run: python experiments/operation-path-sensitivity/intervention.py --verify results/intervention.json
      - uses: actions/upload-artifact@v4
        with:
          name: ops002-${{ matrix.os }}
          path: results/intervention.json
          if-no-files-found: error
