name: GSM address attention
on:
  pull_request:
    paths:
      - 'experiments/vl-machine/gsm/address_attention/**'
      - '.github/workflows/gsm-address-attention.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/vl-machine/gsm/address_attention/**'
      - '.github/workflows/gsm-address-attention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  address-attention:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify full address and trainable softmax
        working-directory: experiments/vl-machine/gsm/address_attention
        run: |
          python -m unittest -v
          python address_attention.py --output report.json
          python prefix_control.py --output prefix_report.json
          python trainable.py --output training.json
          python - <<'PY'
          import json
          a=json.load(open('report.json'))[-1]
          assert a['n']==2**24 and a['error']<1e-10 and a['work']['base_key_scores']==256
          t=json.load(open('training.json'))
          assert t['max_gradient_error']<1e-10
          assert t['full_address_training']['final_mse']<t['full_address_training']['initial_mse']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gsm-address-attention
          path: |
            experiments/vl-machine/gsm/address_attention/report.json
            experiments/vl-machine/gsm/address_attention/prefix_report.json
            experiments/vl-machine/gsm/address_attention/training.json
