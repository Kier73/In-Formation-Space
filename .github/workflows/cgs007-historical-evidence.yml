name: CGS-007 historical signed Ground reconstruction

on:
  pull_request:
    paths:
      - "experiments/contextual-ground-sections/**"
      - "experiments/cross-ground-continuity/gci004/fabric_contract.py"
      - "experiments/cross-ground-continuity/gci005/honesty_contract.py"
      - ".github/workflows/cgs007-historical-evidence.yml"
  push:
    branches: [main]
    paths:
      - "experiments/contextual-ground-sections/**"
      - "experiments/cross-ground-continuity/gci004/fabric_contract.py"
      - "experiments/cross-ground-continuity/gci005/honesty_contract.py"
      - ".github/workflows/cgs007-historical-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install signed-receipt primitives
        run: python -m pip install "cryptography>=43,<47"
      - name: Test historical certificate validity, source pinning and blind realization
        run: python -m unittest discover -s experiments/contextual-ground-sections -p 'test_historical_bridge.py' -v
      - name: Independent long-horizon computation
        run: node --test experiments/contextual-ground-sections/test_historical_projection.js
      - name: GCI-004 and GCI-005 existing tests still pass
        run: |
          python -m unittest discover -s experiments/cross-ground-continuity/gci004 -p 'test_fabric_contract.py' -v
          python -m unittest discover -s experiments/cross-ground-continuity/gci005 -p 'test_contract.py' -v

  archived-receipt-consumer:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install independent cryptographic verifier dependencies
        run: python -m pip install "cryptography>=43,<47"
      - name: Enforce fixed GitHub CLI signer-workflow verification
        shell: bash
        run: |
          set -euo pipefail
          gh version
          python - <<'PY'
          import re, subprocess
          s = subprocess.check_output(["gh", "version"], text=True).splitlines()[0]
          m = re.search(r"\b(\d+)\.(\d+)\.(\d+)\b", s)
          assert m is not None and tuple(map(int, m.groups())) >= (2,102,0), \
              "GitHub CLI >=2.102.0 required for exact signer-workflow identity"
          PY
      - name: Download pinned historical source attestations (never private phase)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cag004 evidence/cgs007
          for artifact in \
            cag004-signed-intention \
            gci002-ecpu-eight-edge-orbit-probe \
            gci002-vgi-closed-orbit-certificate \
            gci003-public-context \
            gci003-minimum-context-plan \
            gci004-authenticated-observer-receipts \
            gci005-real-signed-disagreement \
            gci005-phase-blind-disagreement-refusal
          do
            gh run download 43616685083 --repo Kier73/In-Formation-Space \
              --name "$artifact" --dir evidence/cag004
          done
          test ! -e evidence/cag004/gci003-private.json
          gh api repos/Kier73/In-Formation-Space/actions/runs/43616685083 \
            --jq '{id,head_sha,event,head_branch,path,status,conclusion,run_started_at,updated_at}' \
            > evidence/cgs007/source-run-metadata.json
          python - <<'PY'
          import json
          d=json.load(open("evidence/cgs007/source-run-metadata.json"))
          assert d["head_sha"]=="90e719ae6efab12107ee8de2b77afe5e73dd35b2"
          assert d["id"]==43616685083 and d["conclusion"]=="success"
          PY
      - name: Require source artifact attestation, exact workflow and source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            signed-intent.json issuer-trust.json \
            orbit-probe.json closed-orbit-report.json \
            gci003-public.json gci003-plan.json \
            gci004-network.json gci005-quorum.json gci005-blind-audit.json
          do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main \
              --source-digest 90e719ae6efab12107ee8de2b77afe5e73dd35b2 \
              --deny-self-hosted-runners --format json > /dev/null
          done
      - name: Recheck historical leaf ECDSA signatures and phase-blind Ground intention
        run: |
          python experiments/contextual-ground-sections/historical_bridge.py \
            --directory evidence/cag004 \
            --run-metadata evidence/cgs007/source-run-metadata.json \
            --output evidence/cgs007/historical-bridge.json
      - name: Independent Node signature and Ground projection reconstruction
        run: |
          node experiments/contextual-ground-sections/verify_historical_projection.js \
            evidence/cgs007/historical-bridge.json \
            evidence/cag004/gci003-public.json \
            evidence/cag004/gci005-quorum.json \
            evidence/cag004/gci005-blind-audit.json \
            > evidence/cgs007/secondary-reconstruction.json
      - name: Mutation audit over real signed source artifacts, not synthetic fixtures
        run: |
          node experiments/contextual-ground-sections/test_historical_artifact.js \
            evidence/cgs007/historical-bridge.json \
            evidence/cag004/gci003-public.json \
            evidence/cag004/gci005-quorum.json \
            evidence/cag004/gci005-blind-audit.json \
            > evidence/cgs007/adversarial-replay.json
      - name: Attest new replay outputs on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            evidence/cgs007/historical-bridge.json
            evidence/cgs007/secondary-reconstruction.json
            evidence/cgs007/adversarial-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: cgs007-historical-receipt-ground-reconstruction
          path: |
            evidence/cgs007/historical-bridge.json
            evidence/cgs007/secondary-reconstruction.json
            evidence/cgs007/source-run-metadata.json
          retention-days: 90
          if-no-files-found: error
