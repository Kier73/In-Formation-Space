name: PGT-002 partial Ground training and counterexample-guided observation
on:
  pull_request:
    paths:
      - 'experiments/procedural_ground_training/**'
      - '.github/workflows/pgt002-cross-family-transfer.yml'
  push:
    paths:
      - 'experiments/procedural_ground_training/**'
      - '.github/workflows/pgt002-cross-family-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install numerical training tools
        run: python -m pip install 'numpy>=2.0,<3' 'torch>=2.5,<2.12'
      - name: Train actual neural parameters on three families, with the automaton family held out
        working-directory: experiments/procedural_ground_training
        run: python train_transfer.py --train 12000 --valid 1800 --test 1600 --ood 1400 --ood32 1000 --epochs 28 --repair 180 --output results
      - name: Train exact-partial-feature hybrid as negative comparator
        working-directory: experiments/procedural_ground_training
        run: python train_hybrid.py --train 12000 --valid 1800 --test 1600 --ood 1400 --ood32 1000 --epochs 28 --output results
      - name: Active query comparisons against paired random controls
        working-directory: experiments/procedural_ground_training
        run: |
          python compare_observation_policies.py --model-dir results --output results/paired-observation-report.json --cases 600 --extra 4
          python active_version_space.py --cases 1200 --budget 6 --output results/teacher-free-active.json
      - name: Real local HTTP origin loss, source replacement and tampered model refusal
        working-directory: experiments/procedural_ground_training
        run: python http_transfer_audit.py --model-dir results --output results/http-transfer-report.json
      - name: Require explicit negative results and no silent native-skip acceptance
        working-directory: experiments/procedural_ground_training
        run: python -m unittest -v test_transfer.py
      - name: Preserve trained tensor bytes and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: pgt002-learned-ground-and-audit
          path: |
            experiments/procedural_ground_training/results/partial_ground_student.npz
            experiments/procedural_ground_training/results/manifest.json
            experiments/procedural_ground_training/results/transfer-report.json
            experiments/procedural_ground_training/results/hybrid_student.npz
            experiments/procedural_ground_training/results/hybrid-manifest.json
            experiments/procedural_ground_training/results/hybrid-report.json
            experiments/procedural_ground_training/results/paired-observation-report.json
            experiments/procedural_ground_training/results/teacher-free-active.json
            experiments/procedural_ground_training/results/http-transfer-report.json
          if-no-files-found: error
  native-ecpu-ground-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 6fd416facdb2aefd6fc7d66a06b014e3d31b5a52
          path: external/E-CPU
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Hard-require actual E-CPU IOS-001 and distant-coordinate law navigator
        env:
          PYTHONPATH: '${{ github.workspace }}/external/E-CPU:${{ github.workspace }}/experiments/procedural_ground_training'
        working-directory: experiments/procedural_ground_training
        run: python -m unittest -v test_native_transfer.py
  independent-receiver:
    needs: train-audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.24,<3' 'torch>=2.5,<2.12'
      - uses: actions/download-artifact@v4
        with:
          name: pgt002-learned-ground-and-audit
          path: experiments/procedural_ground_training/results/
      - name: Source-separated checkpoint read and heldout observation tests
        working-directory: experiments/procedural_ground_training
        run: python -m unittest -v test_transfer.py
