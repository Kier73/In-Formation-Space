name: Portable realization capsules PRC-001

on:
  push:
    paths:
      - "experiments/portable-realization-capsule/**"
      - ".github/workflows/portable-realization-capsule.yml"
  pull_request:
    paths:
      - "experiments/portable-realization-capsule/**"
      - ".github/workflows/portable-realization-capsule.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prc-001-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable-realization-capsule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment workspace
        uses: actions/checkout@v4

      - name: Check out pinned E-CPU implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65
          path: external/E-CPU

      - name: Check out pinned Virtual-Ground-Interpreter
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ac13c1bbd92dfd09f17de51adef7adb2d2088bf6
          path: external/Virtual-Ground-Interpreter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for independent capsule verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check independent Node receiver syntax
        run: node --check experiments/portable-realization-capsule/verify_capsule.mjs

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Check capsule module and runner syntax
        run: >-
          python -m py_compile
          experiments/portable-realization-capsule/portable_realization.py
          experiments/portable-realization-capsule/run_experiment.py
          experiments/portable-realization-capsule/portable_stateful_checkpoint.py
          experiments/portable-realization-capsule/stateful_recovery_handoff.py

      - name: Run capsule and E-CPU sparse transition regressions
        env:
          PYTHONPATH: experiments/portable-realization-capsule:external/E-CPU:external/Virtual-Ground-Interpreter/virtual_ground_interpreter
        run: >-
          python -m pytest
          experiments/portable-realization-capsule/test_portable_realization.py
          experiments/portable-realization-capsule/test_portable_stateful_checkpoint.py
          experiments/portable-realization-capsule/test_stateful_recovery_handoff.py
          external/E-CPU/tests/test_transition_space.py

      - name: Execute portable realization capsule corpus
        env:
          PYTHONPATH: experiments/portable-realization-capsule:external/E-CPU:external/Virtual-Ground-Interpreter/virtual_ground_interpreter
          ECPU_REVISION: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65
          VGI_REVISION: ac13c1bbd92dfd09f17de51adef7adb2d2088bf6
          IFS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python experiments/portable-realization-capsule/run_experiment.py
          --output experiments/portable-realization-capsule/results/ci-result.json

      - name: Upload portable realization capsule evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-realization-capsules-prc-001
          path: experiments/portable-realization-capsule/results/ci-result.json
          if-no-files-found: warn
