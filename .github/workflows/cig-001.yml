name: CIG-001/002 intention-equivalent cut Grounds

on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-001.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-001.yml'
  workflow_dispatch:

jobs:
  source-replay:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact CNF, rank oracle, adversarial source replay
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Reproduce matched symbolic Ground ledger
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python run_cut_intention.py

      - name: Reproduce coupled-source Ground ledger and run actual PNG-001 control
        working-directory: experiments/pnp-ground-navigation/cut_intention
        env:
          CIG002_REQUIRE_PNG: '1'
        run: python run_coupled_ground.py
