name: Robust sequential acquisition RIV-016

on:
  push:
    paths:
      - "experiments/robust-likelihood-acquisition/robust_sequential_acquisition.py"
      - "experiments/robust-likelihood-acquisition/test_robust_sequential_acquisition.py"
      - "experiments/robust-likelihood-acquisition/robust-sequential-acquisition.schema.json"
      - "experiments/robust-likelihood-acquisition/robust_sequential_example.py"
      - "experiments/robust-likelihood-acquisition/RIV-016-README.md"
      - ".github/workflows/robust-sequential-acquisition.yml"
      - "experiments/robust-likelihood-acquisition/robust_likelihood_acquisition.py"
  pull_request:
    paths:
      - "experiments/robust-likelihood-acquisition/robust_sequential_acquisition.py"
      - "experiments/robust-likelihood-acquisition/test_robust_sequential_acquisition.py"
      - "experiments/robust-likelihood-acquisition/robust-sequential-acquisition.schema.json"
      - "experiments/robust-likelihood-acquisition/robust_sequential_example.py"
      - "experiments/robust-likelihood-acquisition/RIV-016-README.md"
      - ".github/workflows/robust-sequential-acquisition.yml"
      - "experiments/robust-likelihood-acquisition/robust_likelihood_acquisition.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust-sequential-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate recursive policy schema
        run: |
          python -c "import json, jsonschema; p='experiments/robust-likelihood-acquisition/robust-sequential-acquisition.schema.json'; s=json.load(open(p, encoding='utf-8')); jsonschema.Draft202012Validator.check_schema(s)"
      - name: Compile robust policy modules and example
        run: |
          python -m py_compile experiments/robust-likelihood-acquisition/robust_likelihood_acquisition.py
          python -m py_compile experiments/robust-likelihood-acquisition/robust_sequential_acquisition.py
          python -m py_compile experiments/robust-likelihood-acquisition/robust_sequential_example.py
      - name: Run adaptive robust policy tests
        run: python -m unittest discover -s experiments/robust-likelihood-acquisition -p "test_robust_sequential_acquisition.py" -v
      - name: Run reproducible adaptive policy example
        run: python experiments/robust-likelihood-acquisition/robust_sequential_example.py
