name: Realization cost navigation RCN-001

on:
  push:
    branches:
      - main
    paths:
      - "experiments/realization-cost-navigation/README.md"
      - "experiments/realization-cost-navigation/PLAN.md"
      - "experiments/realization-cost-navigation/navigator.py"
      - "experiments/realization-cost-navigation/run_experiment.py"
      - "experiments/realization-cost-navigation/test_navigation.py"
      - ".github/workflows/realization-cost-navigation.yml"
  pull_request:
    paths:
      - "experiments/realization-cost-navigation/README.md"
      - "experiments/realization-cost-navigation/PLAN.md"
      - "experiments/realization-cost-navigation/navigator.py"
      - "experiments/realization-cost-navigation/run_experiment.py"
      - "experiments/realization-cost-navigation/test_navigation.py"
      - ".github/workflows/realization-cost-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcn-001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  realization-cost-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment workspace
        uses: actions/checkout@v4

      - name: Check out pinned E-CPU implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c82d795e6b7602cc3d6e8c41e8622820914f5cbf
          path: external/E-CPU

      - name: Check out pinned VGI reference
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ac13c1bbd92dfd09f17de51adef7adb2d2088bf6
          path: external/Virtual-Ground-Interpreter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Pareto and budget navigation policy tests
        run: python -m pytest experiments/realization-cost-navigation/test_navigation.py -q

      - name: Execute complete compiler cost corpus and cross-runtime verification
        env:
          PYTHONPATH: external/E-CPU:external/Virtual-Ground-Interpreter/virtual_ground_interpreter
          ECPU_REVISION: c82d795e6b7602cc3d6e8c41e8622820914f5cbf
          VGI_REVISION: ac13c1bbd92dfd09f17de51adef7adb2d2088bf6
          IFS_REVISION: \${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python experiments/realization-cost-navigation/run_experiment.py
          --output experiments/realization-cost-navigation/results/ci-result.json

      - name: Run E-CPU finite transition compiler regression tests
        env:
          PYTHONPATH: external/E-CPU
        run: python -m pytest external/E-CPU/tests/test_transition_space.py -q

      - name: Run VGI finite transition and Boolean subgroup tests
        env:
          PYTHONPATH: external/Virtual-Ground-Interpreter/virtual_ground_interpreter
        run: |
          python -m unittest discover -s external/Virtual-Ground-Interpreter/virtual_ground_interpreter/tests -p "test_finite_state_transition.py" -v
          python -m unittest discover -s external/Virtual-Ground-Interpreter/virtual_ground_interpreter/tests -p "test_boolean_subgroup.py" -v

      - name: Upload deterministic RCN-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realization-cost-navigation-rcn-001
          path: experiments/realization-cost-navigation/results/ci-result.json
          if-no-files-found: warn
