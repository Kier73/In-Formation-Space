name: GSM adaptive geometry
on:
  push:
    branches: [main]
    paths:
      - 'experiments/vl-machine/gsm/address_attention/**'
      - '.github/workflows/gsm-adaptive-geometry.yml'
  pull_request:
    paths:
      - 'experiments/vl-machine/gsm/address_attention/**'
      - '.github/workflows/gsm-adaptive-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5
      - name: Verify learned geometry and refusal
        working-directory: experiments/vl-machine/gsm/address_attention
        run: |
          python -m unittest -v test_geometry
          python geometry.py --output geometry-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: gsm-adaptive-geometry
          path: experiments/vl-machine/gsm/address_attention/geometry-report.json
