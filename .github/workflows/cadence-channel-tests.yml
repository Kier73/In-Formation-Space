name: Cadence channel tests

on:
  push:
    paths:
      - "experiments/cadence-channel/**"
      - ".github/workflows/cadence-channel-tests.yml"
  pull_request:
    paths:
      - "experiments/cadence-channel/**"
      - ".github/workflows/cadence-channel-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run cadence-channel tests
        run: python -m unittest discover -s experiments/cadence-channel -p "test_*.py" -v
      - name: Exercise the scan and source-check CLI
        run: >-
          python experiments/cadence-channel/cadence.py
          --scan --source-checks
          --trials 2000 --seed 20261112 --seed-count 100 --json
          > /dev/null
