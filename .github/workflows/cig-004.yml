name: CIG-004 source-derived nonlinear temporal observer

on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-004.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-004.yml'
  workflow_dispatch:

jobs:
  source-and-native-cross-repo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NCR-007 for actual Boolean polynomial pullbacks
        uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: navigable-compute-reference
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Original-CNF and adversarial CIG-001 through CIG-004 regression
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Real PNG SFI OFG and pinned NCR-007 integration (no fallback)
        working-directory: experiments/pnp-ground-navigation/cut_intention
        env:
          PYTHONPATH: ${{ github.workspace }}/navigable-compute-reference
        run: python run_cross_repo_chain.py
      - name: Regenerate bounded nonlinear temporal-cost ledger
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python run_chain_observer.py
