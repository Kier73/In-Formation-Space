name: Distributed causal operation path

on:
  push:
    paths:
      - "bridges/observation-path/operation_spans.py"
      - "bridges/observation-path/tailscale_overlay_probe.py"
      - "bridges/observation-path/test_tailscale_overlay_probe.py"
      - "bridges/observation-path/ihp005-overlay-*.schema.json"
      - ".github/workflows/tailscale-overlay-preflight.yml"
      - "bridges/observation-path/direct_mtls_operation_path.py"
      - "bridges/observation-path/test_direct_mtls_operation_path.py"
      - "bridges/observation-path/direct-mtls-*.schema.json"
      - ".github/workflows/direct-mtls-operation-path.yml"
      - ".github/workflows/tailscale-mtls-operation-path.yml"
      - "bridges/observation-path/distributed_operation_path.py"
      - "bridges/observation-path/independent_host_path.py"
      - "bridges/observation-path/test_independent_host_path.py"
      - "bridges/observation-path/independent-host-operation-*.schema.json"
      - "bridges/observation-path/test_distributed_operation_path.py"
      - "bridges/observation-path/distributed-operation-path*.schema.json"
      - "bridges/temporal-provenance/clock_calibration.py"
      - "bridges/temporal-provenance/temporal_provenance.py"
      - ".github/workflows/distributed-causal-operation-path.yml"
      - ".github/workflows/independent-host-operation-path.yml"
  pull_request:
    paths:
      - "bridges/observation-path/operation_spans.py"
      - "bridges/observation-path/tailscale_overlay_probe.py"
      - "bridges/observation-path/test_tailscale_overlay_probe.py"
      - "bridges/observation-path/ihp005-overlay-*.schema.json"
      - ".github/workflows/tailscale-overlay-preflight.yml"
      - "bridges/observation-path/direct_mtls_operation_path.py"
      - "bridges/observation-path/test_direct_mtls_operation_path.py"
      - "bridges/observation-path/direct-mtls-*.schema.json"
      - ".github/workflows/direct-mtls-operation-path.yml"
      - ".github/workflows/tailscale-mtls-operation-path.yml"
      - "bridges/observation-path/distributed_operation_path.py"
      - "bridges/observation-path/independent_host_path.py"
      - "bridges/observation-path/test_independent_host_path.py"
      - "bridges/observation-path/independent-host-operation-*.schema.json"
      - "bridges/observation-path/test_distributed_operation_path.py"
      - "bridges/observation-path/distributed-operation-path*.schema.json"
      - "bridges/temporal-provenance/clock_calibration.py"
      - "bridges/temporal-provenance/temporal_provenance.py"
      - ".github/workflows/distributed-causal-operation-path.yml"
      - ".github/workflows/independent-host-operation-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned E-CPU temporal and reliable-channel implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema and direct-mTLS test dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5" "cryptography>=42,<47" "PyYAML>=6,<7"
      - name: Compile operation-path implementations
        run: python -m py_compile bridges/observation-path/operation_spans.py bridges/observation-path/distributed_operation_path.py bridges/observation-path/independent_host_path.py bridges/observation-path/direct_mtls_operation_path.py bridges/observation-path/tailscale_overlay_probe.py
      - name: Run existing operation-span tests
        run: python -m unittest discover -s bridges/observation-path -p 'test_operation_spans.py' -v
      - name: Run distributed causal operation-path tests
        env:
          PYTHONPATH: external/E-CPU
        run: python -m unittest discover -s bridges/observation-path -p 'test_distributed_operation_path.py' -v
      - name: Run independent hosted-host reconstruction tests
        env:
          PYTHONPATH: external/E-CPU
        run: python -m unittest discover -s bridges/observation-path -p 'test_independent_host_path.py' -v
      - name: Run direct mTLS operation-path protocol tests
        env:
          PYTHONPATH: external/E-CPU
        run: python -m unittest discover -s bridges/observation-path -p 'test_direct_mtls_operation_path.py' -v
      - name: Run Tailscale overlay route-probe tests
        run: python -m unittest discover -s bridges/observation-path -p 'test_tailscale_overlay_probe.py' -v
      - name: Validate IHP-005 workflow YAML and reject duplicate keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(f"duplicate YAML key: {key!r}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )
          workflow = yaml.load(
              Path(".github/workflows/tailscale-overlay-preflight.yml").read_text(encoding="utf-8"),
              Loader=UniqueKeyLoader,
          )
          jobs = workflow.get("jobs", {})
          expected = {"client_host", "server_host", "verifier_host"}
          if set(jobs) != expected:
              raise SystemExit(f"unexpected IHP-005 jobs: {sorted(jobs)}")
          for name, job in jobs.items():
              if "permissions" not in job or "steps" not in job:
                  raise SystemExit(f"job {name} is missing permissions or steps")
          print("valid IHP-005 workflow YAML; no duplicate keys")
          PY
      - name: Validate IHP-006 Tailscale mTLS workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(f"duplicate YAML key: {key!r}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )
          workflow = yaml.load(
              Path(".github/workflows/tailscale-mtls-operation-path.yml").read_text(encoding="utf-8"),
              Loader=UniqueKeyLoader,
          )
          if set(workflow.get("jobs", {})) != {"client_host", "server_host", "verifier_host"}:
              raise SystemExit("IHP-006 must define client_host, server_host, and verifier_host")
          if "workflow_dispatch" not in workflow.get("on", {}):
              raise SystemExit("IHP-006 must be manually dispatched")
          for name, job in workflow["jobs"].items():
              if "permissions" not in job or "steps" not in job:
                  raise SystemExit(f"IHP-006 job {name} is missing permissions or steps")
          action = "tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c"
          if workflow["jobs"]["client_host"]["steps"] is None:
              raise SystemExit("IHP-006 client job has no steps")
          if not any(step.get("uses") == action for job in workflow["jobs"].values() for step in job["steps"]):
              raise SystemExit("IHP-006 must pin the Tailscale action to a full commit SHA")
          print("valid IHP-006 workflow YAML; no duplicate keys; Tailscale action pinned")
          PY
      - name: Validate distributed path schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in (
              Path("bridges/observation-path/distributed-operation-path.schema.json"),
              Path("bridges/observation-path/distributed-operation-path-report.schema.json"),
              Path("bridges/observation-path/independent-host-operation-record.schema.json"),
              Path("bridges/observation-path/independent-host-operation-report.schema.json"),
              Path("bridges/observation-path/independent-host-operation-report-predicate.schema.json"),
              Path("bridges/observation-path/direct-mtls-host-certificate-predicate.schema.json"),
              Path("bridges/observation-path/direct-mtls-host-record.schema.json"),
              Path("bridges/observation-path/direct-mtls-host-record-predicate.schema.json"),
              Path("bridges/observation-path/direct-mtls-reconstruction-report.schema.json"),
              Path("bridges/observation-path/direct-mtls-reconstruction-report-predicate.schema.json"),
              Path("bridges/observation-path/ihp005-overlay-address.schema.json"),
              Path("bridges/observation-path/ihp005-overlay-address-predicate.schema.json"),
              Path("bridges/observation-path/ihp005-overlay-probe-record.schema.json"),
              Path("bridges/observation-path/ihp005-overlay-probe-record-predicate.schema.json"),
              Path("bridges/observation-path/ihp005-overlay-report.schema.json"),
              Path("bridges/observation-path/ihp005-overlay-report-predicate.schema.json"),
          ):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"valid Draft 2020-12 schema: {path}")
          PY
