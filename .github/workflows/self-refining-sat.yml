name: SFI-003 Recursive SAT interpreter development
on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/recursive_sat_compiler.py'
      - 'experiments/pnp-ground-navigation/self_selecting_sat.py'
      - 'experiments/pnp-ground-navigation/test_recursive_sat_compiler.py'
      - 'experiments/pnp-ground-navigation/run_recursive_sat.py'
      - 'experiments/pnp-ground-navigation/SFI-003.md'
      - 'experiments/pnp-ground-navigation/SFI-003-results.json'
      - '.github/workflows/self-refining-sat.yml'
  push:
    paths:
      - 'experiments/pnp-ground-navigation/recursive_sat_compiler.py'
      - 'experiments/pnp-ground-navigation/self_selecting_sat.py'
      - 'experiments/pnp-ground-navigation/test_recursive_sat_compiler.py'
      - 'experiments/pnp-ground-navigation/run_recursive_sat.py'
      - 'experiments/pnp-ground-navigation/SFI-003.md'
      - '.github/workflows/self-refining-sat.yml'
jobs:
  proof-qualified-self-development:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute recursive compiler, meta-proof audit, and all predecessors
        working-directory: experiments/pnp-ground-navigation
        run: python -m unittest -v test_recursive_sat_compiler.py test_morphic_sat.py test_self_selecting_sat.py test_self_forming_sat.py test_derived_ground.py test_algebraic_ground.py test_frontier_ground.py
      - name: Execute measured self-development campaign
        working-directory: experiments/pnp-ground-navigation
        run: python run_recursive_sat.py
