name: RCP-003 atomic semantic and receiver effect handoff

on:
  pull_request:
    paths:
      - 'experiments/resource-continuity-prefix/atomic_semantic_effect.py'
      - 'experiments/resource-continuity-prefix/atomic_handoff_crash_worker.py'
      - 'experiments/resource-continuity-prefix/test_atomic_semantic_effect.py'
      - 'experiments/resource-continuity-prefix/run_atomic_handoff.py'
      - 'experiments/resource-continuity-prefix/RCP-003.md'
      - '.github/workflows/rcp003-atomic-semantic-handoff.yml'
  push:
    branches:
      - research/rcp003-semantic-effect-atomic-handoff
    paths:
      - 'experiments/resource-continuity-prefix/atomic_semantic_effect.py'
      - 'experiments/resource-continuity-prefix/atomic_handoff_crash_worker.py'
      - 'experiments/resource-continuity-prefix/test_atomic_semantic_effect.py'
      - 'experiments/resource-continuity-prefix/run_atomic_handoff.py'
      - '.github/workflows/rcp003-atomic-semantic-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-continuation:
    name: Real quorum + VL-I qualified Ground + hard-crashed receiver
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Pin original E-CPU quorum and receiver implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: e380070312b7553d8bd4860a460bb7b9dce7070a
          path: external/E-CPU
          persist-credentials: false
      - name: Pin original VL-I environment-derived interpreter
        uses: actions/checkout@v4
        with:
          repository: Kier73/VL-I
          ref: b8ec6b5edae4845dcb9f3f94e9684da21fc41101
          path: external/VL-I
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native E-CPU/VL-I and independent tests
        run: |
          python -m pip install -e ./external/E-CPU
          python -m pip install -e ./external/VL-I
          python -m pip install 'pytest>=8,<9' 'jsonschema>=4,<5'
      - name: Rerun old independent continuation and new real crash/recovery tests
        shell: bash
        run: |
          export PYTHONPATH="$PWD/experiments/duplicated-authority-domain:$PWD/experiments/resource-continuity-prefix:$PWD/external/E-CPU:$PWD/external/VL-I/src"
          python -m pytest -q external/VL-I/tests/test_temporal_intelligence.py experiments/resource-continuity-prefix/test_receiver.py experiments/resource-continuity-prefix/test_temporal_meet.py experiments/resource-continuity-prefix/test_atomic_semantic_effect.py
      - name: Execute a fresh five-hard-crash native benchmark independently
        shell: bash
        run: |
          export PYTHONPATH="$PWD/experiments/duplicated-authority-domain:$PWD/experiments/resource-continuity-prefix:$PWD/external/E-CPU:$PWD/external/VL-I/src"
          python experiments/resource-continuity-prefix/run_atomic_handoff.py --output rcp003-atomic-handoff-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: rcp003-${{ matrix.os }}-${{ matrix.python-version }}
          path: rcp003-atomic-handoff-report.json
          if-no-files-found: error
