name: Branching morphology

on:
  pull_request:
    paths:
      - "experiments/branching-morphology/**"
      - ".github/workflows/branching-morphology.yml"
  push:
    branches: [main]
    paths:
      - "experiments/branching-morphology/**"
      - ".github/workflows/branching-morphology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library contract tests
        run: python -m unittest discover -s experiments/branching-morphology -p 'test_*.py' -v
      - name: Generate deterministic morphology atlas
        run: |
          python experiments/branching-morphology/canopy.py \
            --svg "$RUNNER_TEMP/canopies.svg" \
            --json "$RUNNER_TEMP/measurements.json" > /dev/null
      - name: Validate SVG and compare numeric observations
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path(os.environ["RUNNER_TEMP"])
          svg = ET.parse(root / "canopies.svg").getroot()
          assert svg.tag == "{http://www.w3.org/2000/svg}svg"
          expected = json.loads(Path("experiments/branching-morphology/results/default-measurements.json").read_text())
          actual = json.loads((root / "measurements.json").read_text())
          assert actual["rule"] == expected["rule"]
          assert actual["iterations"] == expected["iterations"]
          assert len(actual["records"]) == len(expected["records"]) == 5
          for observed, reference in zip(actual["records"], expected["records"]):
              assert observed["angle_degrees"] == reference["angle_degrees"]
              assert observed["segments"] == reference["segments"] == 625
              for name in ("width", "height", "aspect_width_over_height", "hull_area", "hull_fraction_of_bbox"):
                  assert math.isclose(observed[name], reference[name], rel_tol=1e-7, abs_tol=1e-4), (name, observed, reference)
          print("SVG parses and measured geometry agrees with retained observations")
          PY
      - name: Generate and validate exact depth-four proof record
        run: |
          python experiments/branching-morphology/depth4_phase.py > "$RUNNER_TEMP/depth4-certificate.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          record = json.loads((Path(os.environ["RUNNER_TEMP"]) / "depth4-certificate.json").read_text())
          assert record["symbolic_endpoints"] == 626
          assert record["exact_halfplane_constraints"] == 1007
          assert record["exact_strict_convexity_checks"] == 37
          assert len(record["boundaries"]) == 4
          assert [x["hull_vertices"] for x in record["regimes"]] == [4, 5, 6, 7, 7, 8]
          print("Exact depth-four interval certificate validated")
          PY
      - name: Generate and validate exact depth-five proof record
        run: |
          python experiments/branching-morphology/depth5_phase.py > "$RUNNER_TEMP/depth5-certificate.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "depth5-certificate.json").read_text())
          assert report["symbolic_endpoints"] == 3126
          assert report["certified_halfplane_checks"] == 1659
          assert report["strict_convexity_checks"] == 54
          assert report["naive_all_endpoints_checks"] == 168804
          assert [x["hull_vertices"] for x in report["continuous_regimes"]] == [4,5,6,7,7,8,8,9]
          assert [x["hull_vertices"] for x in report["exact_boundaries"]] == [4,5,6,7,8]
          print("Depth-five continuous-angle proof certificate validated")
          PY
      - name: Generate and validate all-depth hull law prerequisite record
        run: |
          python experiments/branching-morphology/all_depth_law.py > "$RUNNER_TEMP/all-depth-hull-certificate.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          record = json.loads((Path(os.environ["RUNNER_TEMP"]) / "all-depth-hull-certificate.json").read_text())
          homothety = record["homothety"]
          assert homothety["certified_scale_equalities"] == 15
          assert homothety["vertex_polynomial_equalities"] == 89
          assert homothety["sigma_outside_witness"]["bernstein_signs_on_sigma_to_one"] == [0,1,1,1,1]
          assert len(record["candidate_recurrence"]["illustrations"]) == 11
          print("Validated prerequisites for all-depth hull absorption induction")
          PY
      - name: Generate and validate exact depth-six proof record
        run: |
          python experiments/branching-morphology/depth6_phase.py > "$RUNNER_TEMP/depth6-certificate.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "depth6-certificate.json").read_text())
          assert report["symbolic_endpoints"] == 15626
          assert report["exact_containment_checks"] == 2483
          assert report["exact_corner_checks"] == 73
          assert report["inherited_hull_regimes"] == 9
          assert report["inherited_vertex_polynomial_identifications"] == 63
          assert report["outside_tip_witness_bernstein_signs"] == [0,1,1,1,1,1]
          assert [x["vertices"] for x in report["regimes"]] == [4,5,6,7,7,8,8,9,9,10]
          assert [x["vertices"] for x in report["boundaries"]] == [4,5,6,7,8,9]
          print("Exact depth-six hull and all-depth stabilization premises validated")
          PY
      - name: Check and retain all-depth tip exposure premise record
        run: |
          python experiments/branching-morphology/tip_exposure.py > "$RUNNER_TEMP/tip-exposure-certificate.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          certificate = json.loads((Path(os.environ["RUNNER_TEMP"]) / "tip-exposure-certificate.json").read_text())
          audits = certificate["finite_audits"]
          assert len(audits) == 8
          assert [x["min_first_order_support_gap"] for x in audits] == [3**n for n in range(8)]
          assert [x["unique_full_depth_tip_index"] for x in audits] == [(3*5**n+1)//4 for n in range(1,9)]
          assert certificate["strict_support_bound"] == "cross(O,A_n,p)>=3^n*theta/16>0 for all other endpoints"
          print("All-depth moment-cone premises and finite audits validated")
          PY
      - name: Verify and retain angle-dependent support-cone certificate
        run: |
          python experiments/branching-morphology/angular_support_cone.py > "$RUNNER_TEMP/angular-support-cone.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          record=json.loads((Path(os.environ["RUNNER_TEMP"]) / "angular-support-cone.json").read_text())
          assert record["experiment"] == "BMO-010"
          assert len(record["finite_audits"]) == 6
          assert [x["total_endpoints"] for x in record["finite_audits"]] == [6,26,126,626,3126,15626]
          assert [x["minimum_support_derivative_gap"] for x in record["finite_audits"]] == [3**n for n in range(6)]
          assert [x["all_depth_exposure_angle_degrees"] for x in record["finite_audits"]] == [45/n for n in range(1,7)]
          print("Angle-dependent stochastic support-cone finite audits passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: branching-morphology-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/canopies.svg
            ${{ runner.temp }}/measurements.json
            ${{ runner.temp }}/depth4-certificate.json
            ${{ runner.temp }}/depth5-certificate.json
            ${{ runner.temp }}/all-depth-hull-certificate.json
            ${{ runner.temp }}/depth6-certificate.json
            ${{ runner.temp }}/tip-exposure-certificate.json
            ${{ runner.temp }}/angular-support-cone.json
