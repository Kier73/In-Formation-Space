name: TCN-004 phase-aware branch navigation
on:
  push:
    paths:
      - 'experiments/quadratic_transfer_grounds/branch.py'
      - 'experiments/quadratic_transfer_grounds/witness.py'
      - 'experiments/quadratic_transfer_grounds/test_phase_branches.py'
      - 'experiments/quadratic_transfer_grounds/run_phase_branches.py'
      - 'experiments/quadratic_transfer_grounds/transfer.py'
      - 'experiments/quadratic_transfer_grounds/cocycle.py'
      - '.github/workflows/tcn004-phase-branches.yml'
  pull_request:
    paths:
      - 'experiments/quadratic_transfer_grounds/**'
      - '.github/workflows/tcn004-phase-branches.yml'
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy
      - name: Validate phase-aware branching and adversarial controls
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s experiments/quadratic_transfer_grounds -p 'test_phase_branches.py' -v
      - name: Execute deterministic cross-substrate evidence run
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/quadratic_transfer_grounds/run_phase_branches.py > /tmp/tcn004-result.json
