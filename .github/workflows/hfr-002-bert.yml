name: HFR-002 BERT header-only observation

on:
  push:
    paths:
      - "experiments/external_neural_structure_reading/live_reference/run_bert_probe.py"
      - "experiments/external_neural_structure_reading/live_reference/run_bert_topology.py"
      - "experiments/external_neural_structure_reading/bert_graph_ir.py"
      - "experiments/external_neural_structure_reading/test_bert_graph_ir.py"
      - "experiments/external_neural_structure_reading/neural_graph_ir.py"
      - ".github/workflows/hfr-002-bert.yml"
  pull_request:
    paths:
      - "experiments/external_neural_structure_reading/live_reference/run_bert_probe.py"
      - "experiments/external_neural_structure_reading/live_reference/run_bert_topology.py"
      - "experiments/external_neural_structure_reading/bert_graph_ir.py"
      - "experiments/external_neural_structure_reading/test_bert_graph_ir.py"
      - "experiments/external_neural_structure_reading/neural_graph_ir.py"
      - ".github/workflows/hfr-002-bert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bert-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HFR schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile HFR source
        run: python -m compileall -q experiments/external_neural_structure_reading
      - name: Run HFR-002 BERT and GPT-2 offline unit tests
        run: python -m unittest discover -s experiments/external_neural_structure_reading -p 'test_*.py' -v
      - name: Observe pinned BERT Safetensors headers
        run: python -m experiments.external_neural_structure_reading.live_reference.run_bert_probe
      - name: Reconstruct complete BERT two-head topology with zero payload reads
        run: python -m experiments.external_neural_structure_reading.live_reference.run_bert_topology
      - name: Upload typed topology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfr-002-bert-base-typed-topology
          path: experiments/external_neural_structure_reading/results/bert-typed-topology.json
          if-no-files-found: warn
      - name: Upload metadata-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: hfr-002-bert-base-header-inventory
          path: experiments/external_neural_structure_reading/results/bert-family-inventory.json
          if-no-files-found: error
