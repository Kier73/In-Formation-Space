name: VLM foundation
on:
  pull_request:
    paths:
      - 'experiments/vl-machine/**'
      - '.github/workflows/vl-machine.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/vl-machine/**'
      - '.github/workflows/vl-machine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vlm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hosted-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable semantics and benchmark
        working-directory: experiments/vl-machine
        run: python3 -m unittest -v && python3 benchmark.py
      - name: Native build and hosted parity
        working-directory: experiments/vl-machine/native64
        run: make && python3 -m unittest -v test_core test_process test_capsule test_application test_neural test_ecpu_bridge.Bridge.test_fresh_worker test_byte_ground test_compose_ground test_typed_ground test_vocabulary test_template_ground test_native_template test_experience test_adaptive_experience
      - name: Byte Ground action and observation audit
        working-directory: experiments/vl-machine/native64
        run: python3 byte_ground.py && python3 benchmark_compose.py && python3 typed_ground.py && python3 benchmark_vocabulary.py && python3 test_native_template.py --benchmark && python3 experience.py --ledger experience.jsonl --summary experience-summary.json
      - name: Self-generated counterexample campaign and retained recipe replay
        working-directory: experiments/vl-machine/native64
        run: |
          python3 adaptive_experience.py --output adaptive-experience.json
          python3 -c "import hashlib,json; m=json.load(open('datasets/vlm012/recipe.json')); assert hashlib.sha256(open('adaptive-experience.json','rb').read()).hexdigest()==m['report_sha256']"
      - name: Policy representation and cost audit
        working-directory: experiments/vl-machine/native64
        run: python3 evaluate_policy.py
      - uses: actions/upload-artifact@v4
        with:
          name: vlm-experience
          path: |
            experiments/vl-machine/native64/experience.jsonl
            experiments/vl-machine/native64/experience-summary.json
            experiments/vl-machine/native64/adaptive-experience.json
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guest dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 binutils
      - name: Native i386 boot
        working-directory: experiments/vl-machine/native
        run: make test
      - name: Native x86-64 boot and parity
        working-directory: experiments/vl-machine/native64
        run: make && python3 test_guest.py
  ecpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 09a9058a43c139c476609954636e17e7fadcfd37
          path: external/ecpu-vlm
          persist-credentials: false
      - name: Real E-CPU M2 capsule adapter
        working-directory: experiments/vl-machine/native64
        env:
          PYTHONPATH: ${{ github.workspace }}/external/ecpu-vlm
        run: make && python3 -m unittest -v test_ecpu_bridge.Bridge

  cross-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/VL-K
          ref: ad6dd45d06b9f349526783d45d0e5706a49ade79
          path: external/vlk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5
      - name: Build independent pinned K1 substrate
        working-directory: external/vlk
        run: |
          mkdir -p dist
          gcc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC src/vlk1.c -o dist/libvlk.so
      - name: Cross-kernel experience and qualification
        working-directory: experiments/vl-machine/native64
        env:
          VLK_ROOT: ${{ github.workspace }}/external/vlk
        run: |
          make
          python -m unittest -v test_cross_observer
          python cross_observer.py
          python -c "import json; a=json.load(open('cross-observer-data.json'))['report']; b=json.load(open('datasets/vlm013/recipe.json')); assert all(a[k]==b[k] for k in ('train_digest','validation_digest','heldout_digest','stress_digest')); assert a['stats']['queries']==960 and a['stress']['queries']==480"
      - name: Shared experience contract and native replay
        working-directory: experiments/vl-machine/native64
        env:
          VLK_ROOT: ${{ github.workspace }}/external/vlk
          VLM_LEDGER: datasets/vlm011/experience.jsonl
          VLK_DATA: cross-observer-data.json
        run: |
          python -m unittest -v test_experience_contract
          python experience_contract.py --vlm "$VLM_LEDGER" --vlk "$VLK_DATA" --output shared-experience.json
      - name: Transfer counterexample observation policies
        working-directory: experiments/vl-machine/native64
        env:
          VLK_ROOT: ${{ github.workspace }}/external/vlk
          VLK_DATA: cross-observer-data.json
        run: |
          python -m unittest -v test_transfer_policy
          python transfer_policy.py --archive "$VLK_DATA" --output transfer-data.json
          python -c "import hashlib,json; m=json.load(open('datasets/vlm015/recipe.json')); assert hashlib.sha256(open('transfer-data.json','rb').read()).hexdigest()==m['report_sha256']"
          python external_descriptor.py --fixture datasets/vlm015/hf-observation.json > external-descriptor.json
      - uses: actions/upload-artifact@v4
        with:
          name: vlm-cross-observer
          path: |
            experiments/vl-machine/native64/cross-observer-data.json
            experiments/vl-machine/native64/shared-experience.json
            experiments/vl-machine/native64/transfer-data.json
            experiments/vl-machine/native64/external-descriptor.json
