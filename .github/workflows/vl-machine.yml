name: VLM foundation
on:
  pull_request:
    paths:
      - 'experiments/vl-machine/**'
      - '.github/workflows/vl-machine.yml'
  push:
    paths:
      - 'experiments/vl-machine/**'
      - '.github/workflows/vl-machine.yml'
permissions:
  contents: read
jobs:
  word-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable semantics
        working-directory: experiments/vl-machine
        run: python3 -m unittest -v
      - name: Layered Ground benchmark
        working-directory: experiments/vl-machine
        run: python3 benchmark.py
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 binutils
      - name: Native boot and serial parity
        working-directory: experiments/vl-machine/native
        run: make test
      - name: VLM-002 native build and hosted parity
        working-directory: experiments/vl-machine/native64
        run: make && python3 -m unittest -v test_core test_process test_capsule test_application
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 09a9058a43c139c476609954636e17e7fadcfd37
          path: external/ecpu-vlm
          persist-credentials: false
      - name: VLM-005 real E-CPU M2 capsule adapter
        working-directory: experiments/vl-machine/native64
        env:
          PYTHONPATH: ${{ github.workspace }}/external/ecpu-vlm
        run: python3 -m unittest -v test_ecpu_bridge.Bridge
      - name: VLM-002 native guest parity
        working-directory: experiments/vl-machine/native64
        run: python3 test_guest.py
