name: AKS-002 compositional Ground, native VGI and E-CPU

on:
  push:
    paths:
      - 'experiments/attention_ground_sufficiency/**'
      - '.github/workflows/aks002.yml'
  pull_request:
    paths:
      - 'experiments/attention_ground_sufficiency/**'
      - '.github/workflows/aks002.yml'
  workflow_dispatch:

jobs:
  exact-ground:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact AKS-001 plus AKS-002 local semantics
        run: python -m unittest discover -s experiments/attention_ground_sufficiency -p 'test_*.py' -v

  native-reuse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual pinned E-CPU and VGI packages
        run: |
          python -m pip install 'git+https://github.com/Kier73/E-CPU.git@6fd416facdb2aefd6fc7d66a06b014e3d31b5a52'
          python -m pip install 'git+https://github.com/Kier73/Virtual-Ground-Interpreter.git@e6e1900782aeede18a4de9046511bbba234dbc6e#subdirectory=virtual_ground_interpreter'
      - name: Require actual native imports, never silently skip
        run: python -c 'from vgi.typed_operator_navigation import FiniteSpace, DenseMap, TypedVector; from mailcpu.computation_dag import ComputationNode, NavigableComputationDAG; print("native VGI/E-CPU imports succeeded")'
      - name: Run full exact mathematics and real native API gates
        run: python -m unittest discover -s experiments/attention_ground_sufficiency -p 'test_*.py' -v
