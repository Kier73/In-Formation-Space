name: HFR-001 GPT-2 five-point layer spectral profile

on:
  push:
    paths:
      - "experiments/external_neural_structure_reading/hub.py"
      - "experiments/external_neural_structure_reading/nsd.py"
      - "experiments/external_neural_structure_reading/spectral_invariants.py"
      - "experiments/external_neural_structure_reading/layer_spectral_profile.py"
      - "experiments/external_neural_structure_reading/gpt2-layer-spectral-profile.schema.json"
      - "experiments/external_neural_structure_reading/test_*.py"
      - "experiments/external_neural_structure_reading/live_reference/run_layer_spectral_profile.py"
      - ".github/workflows/hfr-001-layer-spectral-profile.yml"
  pull_request:
    paths:
      - "experiments/external_neural_structure_reading/hub.py"
      - "experiments/external_neural_structure_reading/nsd.py"
      - "experiments/external_neural_structure_reading/spectral_invariants.py"
      - "experiments/external_neural_structure_reading/layer_spectral_profile.py"
      - "experiments/external_neural_structure_reading/gpt2-layer-spectral-profile.schema.json"
      - "experiments/external_neural_structure_reading/test_*.py"
      - "experiments/external_neural_structure_reading/live_reference/run_layer_spectral_profile.py"
      - ".github/workflows/hfr-001-layer-spectral-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer-spectral-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical and schema dependencies
        run: python -m pip install --disable-pip-version-check numpy jsonschema

      - name: Compile HFR-001
        run: python -m compileall -q experiments/external_neural_structure_reading

      - name: Run all offline HFR-001 tests
        run: >-
          python -m unittest discover
          -s experiments/external_neural_structure_reading
          -p 'test_*.py'
          -v

      - name: Build five-point GPT-2 spectral profile
        run: >-
          python -m experiments.external_neural_structure_reading.live_reference.run_layer_spectral_profile
          --output experiments/external_neural_structure_reading/results/gpt2-layer-spectral-profile.json

      - name: Upload sampled-depth spectral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hfr-001-gpt2-layer-spectral-profile
          path: experiments/external_neural_structure_reading/results/gpt2-layer-spectral-profile.json
          if-no-files-found: warn
