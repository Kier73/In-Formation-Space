name: Decision-value context acquisition RIV-008

on:
  push:
    paths:
      - "experiments/decision-value-context-acquisition/**"
      - "bridges/observation-path/observation_path.py"
      - ".github/workflows/decision-value-context-acquisition.yml"
      - "experiments/context-switching-evidence-accumulator/context_switching_evidence.py"
      - "experiments/calibration-aware-joint-evidence/calibration_aware_evidence.py"
      - "experiments/reference-calibrated-evidence/reference_calibrated_evidence.py"
      - "experiments/reference-calibrated-evidence/test_reference_calibrated_evidence.py"
      - ".github/workflows/decision-value-context-acquisition.yml"
  pull_request:
    paths:
      - "experiments/decision-value-context-acquisition/**"
      - "bridges/observation-path/observation_path.py"
      - ".github/workflows/decision-value-context-acquisition.yml"
      - "experiments/context-switching-evidence-accumulator/context_switching_evidence.py"
      - "experiments/calibration-aware-joint-evidence/calibration_aware_evidence.py"
      - "experiments/reference-calibrated-evidence/reference_calibrated_evidence.py"
      - "experiments/reference-calibrated-evidence/test_reference_calibrated_evidence.py"
      - ".github/workflows/decision-value-context-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-value-context-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate decision-value report schemas
        run: |
          python -c "import json, jsonschema; paths=['experiments/decision-value-context-acquisition/decision-value-acquisition.schema.json','experiments/decision-value-context-acquisition/decision-value-measurement.schema.json']; [jsonschema.Draft202012Validator.check_schema(json.load(open(p, encoding='utf-8'))) for p in paths]"
      - name: Compile decision-value implementation and example
        run: |
          python -m py_compile bridges/observation-path/observation_path.py
          python -m py_compile experiments/decision-value-context-acquisition/decision_value_acquisition.py
          python -m py_compile experiments/decision-value-context-acquisition/acquisition_execution.py
          python -m py_compile experiments/decision-value-context-acquisition/example.py
          python -m py_compile experiments/context-switching-evidence-accumulator/context_switching_evidence.py
          python -m py_compile experiments/calibration-aware-joint-evidence/calibration_aware_evidence.py
          python -m py_compile experiments/reference-calibrated-evidence/reference_calibrated_evidence.py
      - name: Run exact decision-value and evidence-gated execution tests
        env:
          PYTHONPATH: bridges/observation-path:experiments/decision-value-context-acquisition
        run: python -m unittest discover -s experiments/decision-value-context-acquisition -p "test_*.py" -v
      - name: Run reproducible context-acquisition example
        run: python experiments/decision-value-context-acquisition/example.py
