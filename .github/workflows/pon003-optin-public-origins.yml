name: PON-003 opt-in real public R2 and IPFS raw-origin probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  external_storage_observation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_PUBLIC_BASE: '${{ vars.PON003_R2_PUBLIC_BASE }}'
      IPFS_GATEWAY_BASE: '${{ vars.PON003_IPFS_GATEWAY_BASE }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Require separately provisioned allowed public endpoints, no origin fallback
        run: |
          set -euo pipefail
          if [[ -z "$R2_PUBLIC_BASE" || -z "$IPFS_GATEWAY_BASE" ]]; then
            echo "PON-003 live public verification requires repository vars PON003_R2_PUBLIC_BASE and PON003_IPFS_GATEWAY_BASE"
            echo "Neither bucket nor IPFS pins will be created by this read-only workflow"
            exit 1
          fi
      - name: Reconstruct expected publication receipts for the exact local fixture
        run: |
          set -euo pipefail
          python experiments/passive-orbit-cache/pon003_origin.py \
            --kind r2 --output local-claims/r2
          python experiments/passive-orbit-cache/pon003_origin.py \
            --kind ipfs --output local-claims/ipfs
      - name: Verify every signed object through each distinct real public origin
        run: |
          set -euo pipefail
          python experiments/passive-orbit-cache/pon003_public_probe.py \
            --r2-base "$R2_PUBLIC_BASE" \
            --ipfs-base "$IPFS_GATEWAY_BASE" \
            --r2-dir local-claims/r2 \
            --ipfs-dir local-claims/ipfs \
            --output evidence/pon003-public-origin-evidence.json \
            | tee pon003-live-stdout.json
          python - <<'PY'
          import json
          with open("evidence/pon003-public-origin-evidence.json") as f: r=json.load(f)
          assert r["status"]=="both-opt-in-public-storage-protocols-returned-verifiable-source"
          assert r["real_public_gets_verified"] is True
          assert r["result"]==44
          assert r["independent_storage_admins_attested"] is False
          assert r["forced_external_origin_outage_observed"] is False
          PY
      - name: Attest completed read-only public-origin observation
        uses: actions/attest@v4
        with:
          subject-path: evidence/pon003-public-origin-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: pon003-opt-in-real-public-origin-evidence
          path: evidence/pon003-public-origin-evidence.json
          if-no-files-found: error
          retention-days: 60
