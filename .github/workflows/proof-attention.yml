name: Proof attention frontier bridge

on:
  push:
    paths:
      - "bridges/proof-attention/**"
      - "bridges/observation-path/operation_spans.py"
      - "bridges/observation-path/empirical_probe_costs.py"
      - ".github/workflows/proof-attention.yml"
  pull_request:
    paths:
      - "bridges/proof-attention/**"
      - "bridges/observation-path/operation_spans.py"
      - "bridges/observation-path/empirical_probe_costs.py"
      - ".github/workflows/proof-attention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-attention:
    runs-on: ubuntu-latest
    steps:
      - name: Check out In-Formation-Space
        uses: actions/checkout@v4

      - name: Check out VGI proof-ground implementation at pinned revision
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ac13c1bbd92dfd09f17de51adef7adb2d2088bf6
          path: external/Virtual-Ground-Interpreter

      - name: Check out E-CPU trajectory and journal implementation at pinned revision
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c82d795e6b7602cc3d6e8c41e8622820914f5cbf
          path: external/E-CPU

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run proof-attention bridge tests
        env:
          PYTHONPATH: bridges/proof-attention:bridges/observation-path:external/E-CPU:external/Virtual-Ground-Interpreter/virtual_ground_interpreter
        run: >-
          python -m unittest discover
          -s bridges/proof-attention
          -p 'test_*.py'
          -v
      - name: Use E-CPU/VGI/IFS to navigate the observed Python 3.11 invariant failure
        env:
          PYTHONPATH: bridges/proof-attention:bridges/observation-path:external/E-CPU:external/Virtual-Ground-Interpreter/virtual_ground_interpreter
        run: >-
          python bridges/proof-attention/research_ci_proofground.py
          --output "$RUNNER_TEMP/usm011-real-ci-proof-navigation.json"
      - name: Check recorded research direction has no synthetic kernel or CI acceptance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) /
               "usm011-real-ci-proof-navigation.json").read_text()
          )
          assert report["ground_summary"]["unverified_obligations"] == 3
          assert report["ground_summary"]["kernel_accepted_obligations"] == 0
          assert report["native_research_dag"]["next_ready_operation"] == (
              "python-ci-regression"
          )
          assert report["external_kernel_receipt_admitted"] is False
          assert report["merge_authorized"] is False
          print("Real CI failure was navigated; verification remains an obligation")
          PY
      - name: Retain actual failure, VGI/IFS frontier, and native E-CPU evidence DAG
        uses: actions/upload-artifact@v4
        with:
          name: usm011-actual-ci-proof-obligations
          path: ${{ runner.temp }}/usm011-real-ci-proof-navigation.json
          if-no-files-found: error
