name: Independent hosted-VM operation path

on:
  push:
    branches: [main]
    paths:
      - "bridges/observation-path/operation_spans.py"
      - "bridges/observation-path/distributed_operation_path.py"
      - "bridges/observation-path/independent_host_path.py"
      - "bridges/observation-path/test_independent_host_path.py"
      - "bridges/observation-path/independent-host-operation-*.schema.json"
      - "bridges/observation-path/diverse_host_verifier.py"
      - "bridges/observation-path/test_diverse_host_verifier.py"
      - "bridges/observation-path/diverse-host-operation-*.schema.json"
      - "bridges/observation-path/cross_language_verifier/**"
      - "formats/canonical-metadata-v1/**"
      - "experiments/portable-realization-capsule/verify_capsule.mjs"
      - "experiments/portable-realization-capsule/test_canonical_metadata_v1.mjs"
      - "bridges/temporal-provenance/temporal_provenance.py"
      - ".github/workflows/independent-host-operation-path.yml"
  pull_request:
    paths:
      - "bridges/observation-path/diverse_host_verifier.py"
      - "bridges/observation-path/test_diverse_host_verifier.py"
      - "bridges/observation-path/diverse-host-operation-*.schema.json"
      - "bridges/observation-path/cross_language_verifier/**"
      - "formats/canonical-metadata-v1/**"
      - "experiments/portable-realization-capsule/verify_capsule.mjs"
      - "experiments/portable-realization-capsule/test_canonical_metadata_v1.mjs"
      - ".github/workflows/independent-host-operation-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:

  diverse_verifier_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run focused standard-library tests
        run: |
          python -m py_compile \
            bridges/observation-path/diverse_host_verifier.py \
            bridges/observation-path/test_diverse_host_verifier.py
          python -m unittest discover \
            -s bridges/observation-path \
            -p 'test_diverse_host_verifier.py' -v
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate schemas and a reconstructed fixture
        env:
          PYTHONPATH: bridges/observation-path
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from diverse_host_verifier import reconstruct, write_json, write_report_predicate
          from test_diverse_host_verifier import make_pair, verifier_env

          source, source_bytes, receiver, receiver_bytes, verifier = make_pair()
          report = reconstruct(source, source_bytes, receiver, receiver_bytes, verifier)
          with tempfile.TemporaryDirectory() as directory:
              report_path = Path(directory) / "report.json"
              predicate_path = Path(directory) / "predicate.json"
              write_json(report_path, report)
              predicate = write_report_predicate(
                  report_path, predicate_path, verifier_env(verifier)
              )
              cases = (
                  ("bridges/observation-path/diverse-host-operation-report.schema.json", report),
                  ("bridges/observation-path/diverse-host-operation-report-predicate.schema.json", predicate),
              )
              for schema_path, instance in cases:
                  schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
                  Draft202012Validator.check_schema(schema)
                  Draft202012Validator(schema).validate(instance)
                  print(f"valid: {schema_path}")
          PY


  cross_language_verifier_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Go from the module declaration
        uses: actions/setup-go@v6
        with:
          go-version-file: bridges/observation-path/cross_language_verifier/go.mod
      - name: Set up Node.js for the shared canonical metadata receiver
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the shared canonical metadata v1 Node conformance vectors
        run: node --test experiments/portable-realization-capsule/test_canonical_metadata_v1.mjs
      - name: Run Go cross-language reconstruction tests
        working-directory: bridges/observation-path/cross_language_verifier
        env:
          IHP004_TEST_OUTPUT_DIR: ${{ runner.temp }}/ihp004-schema-output
        run: |
          go test -count=1 -v ./...
      - name: Set up Python for Draft 2020-12 schema validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate Go report and predicate schemas against generated outputs
        env:
          IHP004_TEST_OUTPUT_DIR: ${{ runner.temp }}/ihp004-schema-output
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("bridges/observation-path/cross_language_verifier")
          output = Path(os.environ["IHP004_TEST_OUTPUT_DIR"])
          cases = (
              (root / "cross-language-host-operation-report.schema.json", output / "report.json"),
              (root / "cross-language-host-operation-report-predicate.schema.json", output / "predicate.json"),
          )
          for schema_path, instance_path in cases:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              instance = json.loads(instance_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(instance)
              print(f"valid: {instance_path.name}")
          PY

  source_host:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out In-Formation-Space
        uses: actions/checkout@v4
      - name: Check out pinned E-CPU temporal implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65
          path: external/E-CPU
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current signed GitHub CLI package
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes gh
          gh --version
      - name: Produce source-host operation and temporal evidence
        env:
          PYTHONPATH: external/E-CPU
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p evidence
          python bridges/observation-path/independent_host_path.py produce-source \
            --output evidence/host-a.json
          python bridges/observation-path/independent_host_path.py write-predicate \
            --record evidence/host-a.json \
            --role source_host \
            --output evidence/host-a.predicate.json
      - name: Attest source-host evidence bytes
        uses: actions/attest@v4
        with:
          subject-path: evidence/host-a.json
          predicate-type: https://kier73.github.io/in-formation-space/independent-host-operation-path/v1
          predicate-path: evidence/host-a.predicate.json
      - name: Transfer source evidence through GitHub artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: source-host-evidence
          path: evidence/host-a.json
          if-no-files-found: error
          retention-days: 14

  receiver_host:
    needs: source_host
    if: needs.source_host.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out In-Formation-Space
        uses: actions/checkout@v4
      - name: Check out pinned E-CPU temporal implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65
          path: external/E-CPU
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current signed GitHub CLI package
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes gh
          gh --version
      - name: Receive source evidence from the other VM
        uses: actions/download-artifact@v4
        with:
          name: source-host-evidence
          path: received-source
      - name: Verify source attestation, merge causal stamp, and record successor operation
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: external/E-CPU
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p evidence
          python bridges/observation-path/independent_host_path.py produce-receiver \
            --source received-source/host-a.json \
            --output evidence/host-b.json
          python bridges/observation-path/independent_host_path.py write-predicate \
            --record evidence/host-b.json \
            --role receiver_host \
            --output evidence/host-b.predicate.json
      - name: Attest receiver-host evidence bytes
        uses: actions/attest@v4
        with:
          subject-path: evidence/host-b.json
          predicate-type: https://kier73.github.io/in-formation-space/independent-host-operation-path/v1
          predicate-path: evidence/host-b.predicate.json
      - name: Transfer receiver evidence to the independent verifier
        uses: actions/upload-artifact@v4
        with:
          name: receiver-host-evidence
          path: evidence/host-b.json
          if-no-files-found: error
          retention-days: 14

  verifier_host:
    needs: [source_host, receiver_host]
    if: needs.source_host.result == 'success' && needs.receiver_host.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out In-Formation-Space
        uses: actions/checkout@v4
      - name: Check out pinned E-CPU temporal implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65
          path: external/E-CPU
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Install current signed GitHub CLI package
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes gh
          gh --version
      - name: Receive both independently produced records
        uses: actions/download-artifact@v4
        with:
          name: source-host-evidence
          path: received-source
      - name: Receive the receiver-host continuation
        uses: actions/download-artifact@v4
        with:
          name: receiver-host-evidence
          path: received-receiver
      - name: Verify attestations and reconstruct the causal path from a third VM
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: external/E-CPU
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p evidence
          python bridges/observation-path/independent_host_path.py verify \
            --source received-source/host-a.json \
            --receiver received-receiver/host-b.json \
            --output evidence/independent-report.json
      - name: Bind the third-host identity and exact report bytes
        env:
          PYTHONPATH: external/E-CPU
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python bridges/observation-path/independent_host_path.py write-report-predicate \
            --report evidence/independent-report.json \
            --output evidence/independent-report.predicate.json
      - name: Validate records and independent reconstruction report schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          cases = (
              ("bridges/observation-path/independent-host-operation-record.schema.json", "received-source/host-a.json"),
              ("bridges/observation-path/independent-host-operation-record.schema.json", "received-receiver/host-b.json"),
              ("bridges/observation-path/independent-host-operation-report.schema.json", "evidence/independent-report.json"),
              ("bridges/observation-path/independent-host-operation-report-predicate.schema.json", "evidence/independent-report.predicate.json"),
          )
          for schema_path, instance_path in cases:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              instance = json.loads(Path(instance_path).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(instance)
              print(f"valid: {instance_path}")
          PY
      - name: Attest the independently reconstructed report and verifier identity
        uses: actions/attest@v4
        with:
          subject-path: evidence/independent-report.json
          predicate-type: https://kier73.github.io/in-formation-space/independent-host-operation-report/v1
          predicate-path: evidence/independent-report.predicate.json
      - name: Preserve the independent reconstruction result
        uses: actions/upload-artifact@v4
        with:
          name: independent-host-reconstruction-report
          path: evidence/independent-report.json
          if-no-files-found: error
          retention-days: 90

  diverse_verifier_host:
    needs: [source_host, receiver_host]
    if: needs.source_host.result == 'success' && needs.receiver_host.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out In-Formation-Space
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Receive source-host record
        uses: actions/download-artifact@v4
        with:
          name: source-host-evidence
          path: received-source
      - name: Receive receiver-host record
        uses: actions/download-artifact@v4
        with:
          name: receiver-host-evidence
          path: received-receiver
      - name: Reconstruct evidence with a separate standard-library implementation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p evidence
          python bridges/observation-path/diverse_host_verifier.py verify \
            --source received-source/host-a.json \
            --receiver received-receiver/host-b.json \
            --output evidence/diverse-report.json
      - name: Bind the fourth-job identity to the exact report bytes
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python bridges/observation-path/diverse_host_verifier.py write-report-predicate \
            --report evidence/diverse-report.json \
            --output evidence/diverse-report.predicate.json
      - name: Validate diverse report and attestation predicate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          cases = (
              ("bridges/observation-path/diverse-host-operation-report.schema.json", "evidence/diverse-report.json"),
              ("bridges/observation-path/diverse-host-operation-report-predicate.schema.json", "evidence/diverse-report.predicate.json"),
          )
          for schema_path, instance_path in cases:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              instance = json.loads(Path(instance_path).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(instance)
              print(f"valid: {instance_path}")
          PY
      - name: Attest the diverse reconstruction report
        uses: actions/attest@v4
        with:
          subject-path: evidence/diverse-report.json
          predicate-type: https://kier73.github.io/in-formation-space/diverse-host-operation-report/v1
          predicate-path: evidence/diverse-report.predicate.json
      - name: Preserve the diverse reconstruction result
        uses: actions/upload-artifact@v4
        with:
          name: diverse-host-reconstruction-report
          path: evidence/diverse-report.json
          if-no-files-found: error
          retention-days: 90

  cross_language_verifier_host:
    needs: [source_host, receiver_host, verifier_host, diverse_verifier_host]
    if: needs.source_host.result == 'success' && needs.receiver_host.result == 'success' && needs.verifier_host.result == 'success' && needs.diverse_verifier_host.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out In-Formation-Space
        uses: actions/checkout@v4
      - name: Set up Go from the module declaration
        uses: actions/setup-go@v6
        with:
          go-version-file: bridges/observation-path/cross_language_verifier/go.mod
      - name: Run Go conformance tests on the fifth host
        working-directory: bridges/observation-path/cross_language_verifier
        run: go test -count=1 ./...
      - name: Receive source-host record
        uses: actions/download-artifact@v4
        with:
          name: source-host-evidence
          path: bridges/observation-path/cross_language_verifier/received-source
      - name: Receive receiver-host record
        uses: actions/download-artifact@v4
        with:
          name: receiver-host-evidence
          path: bridges/observation-path/cross_language_verifier/received-receiver
      - name: Receive independently reconstructed Python report
        uses: actions/download-artifact@v4
        with:
          name: diverse-host-reconstruction-report
          path: bridges/observation-path/cross_language_verifier/received-diverse
      - name: Reconstruct the same byte records in Go and compare the Python evidence projection
        working-directory: bridges/observation-path/cross_language_verifier
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p evidence
          go run ./cmd/ihp004 verify \
            --source received-source/host-a.json \
            --receiver received-receiver/host-b.json \
            --python-report received-diverse/diverse-report.json \
            --report evidence/go-report.json \
            --predicate evidence/go-report.predicate.json
      - name: Set up Python for report schema validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate the Go report and predicate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("bridges/observation-path/cross_language_verifier")
          cases = (
              (root / "cross-language-host-operation-report.schema.json", root / "evidence/go-report.json"),
              (root / "cross-language-host-operation-report-predicate.schema.json", root / "evidence/go-report.predicate.json"),
          )
          for schema_path, instance_path in cases:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              instance = json.loads(instance_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(instance)
              print(f"valid: {instance_path.name}")
          PY
      - name: Attest the cross-language reconstruction report
        uses: actions/attest@v4
        with:
          subject-path: bridges/observation-path/cross_language_verifier/evidence/go-report.json
          predicate-type: https://kier73.github.io/in-formation-space/cross-language-host-operation-report/v1
          predicate-path: bridges/observation-path/cross_language_verifier/evidence/go-report.predicate.json
      - name: Preserve the cross-language reconstruction result
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-host-reconstruction-report
          path: bridges/observation-path/cross_language_verifier/evidence/go-report.json
          if-no-files-found: error
          retention-days: 90

