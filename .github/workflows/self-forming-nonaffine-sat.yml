name: SFI-002 problem-selected non-affine SAT
on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/morphic_sat.py'
      - 'experiments/pnp-ground-navigation/morphic_verifier.py'
      - 'experiments/pnp-ground-navigation/self_selecting_sat.py'
      - 'experiments/pnp-ground-navigation/test_morphic_sat.py'
      - 'experiments/pnp-ground-navigation/test_self_selecting_sat.py'
      - 'experiments/pnp-ground-navigation/run_morphic_sat.py'
      - 'experiments/pnp-ground-navigation/SFI-002.md'
      - '.github/workflows/self-forming-nonaffine-sat.yml'
  push:
    paths:
      - 'experiments/pnp-ground-navigation/morphic_sat.py'
      - 'experiments/pnp-ground-navigation/morphic_verifier.py'
      - 'experiments/pnp-ground-navigation/self_selecting_sat.py'
      - 'experiments/pnp-ground-navigation/test_morphic_sat.py'
      - 'experiments/pnp-ground-navigation/test_self_selecting_sat.py'
      - 'experiments/pnp-ground-navigation/run_morphic_sat.py'
      - 'experiments/pnp-ground-navigation/SFI-002.md'
      - '.github/workflows/self-forming-nonaffine-sat.yml'
jobs:
  self-forming-nonaffine-sat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact source equivalence and non-affine interpreter tests
        working-directory: experiments/pnp-ground-navigation
        run: python -m unittest -v test_morphic_sat.py test_self_selecting_sat.py test_self_forming_sat.py test_derived_ground.py test_algebraic_ground.py test_frontier_ground.py
      - name: Reproduce non-affine / affine heterogeneous SAT campaign
        working-directory: experiments/pnp-ground-navigation
        run: python run_morphic_sat.py
