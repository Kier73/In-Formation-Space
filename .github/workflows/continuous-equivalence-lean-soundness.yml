name: COE-005 Lean cell soundness

on:
  push:
    branches: [main]
    paths:
      - "experiments/continuous-observation-equivalence/lean/**"
      - ".github/workflows/continuous-equivalence-lean-soundness.yml"
  pull_request:
    paths:
      - "experiments/continuous-observation-equivalence/lean/**"
      - ".github/workflows/continuous-equivalence-lean-soundness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean_branch_soundness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile checked branch and coverage theorems with pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/continuous-observation-equivalence/lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Capture kernel axiom-dependency report for positive theorems
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean COECellSoundness.lean | tee proof-output.txt
          grep -q "selected_sound_of_stable_decision" proof-output.txt
          grep -q "observation_equivalence_of_complete_cover" proof-output.txt
          grep -Fq "'COECellSoundness.selected_sound_of_stable_decision' depends on axioms: [propext]" proof-output.txt
          grep -Fq "'COECellSoundness.observation_equivalence_of_complete_cover' does not depend on any axioms" proof-output.txt
          if grep -Eq 'sorryAx|Classical.choice|Quot.sound' proof-output.txt; then
            cat proof-output.txt
            exit 1
          fi
      - name: Kernel-check rational root exclusion and zero-root endpoint
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean COERationalRoot.lean | tee rational-root-proof-output.txt
          grep -Fq "'COERationalRoot.sign_stable_of_excluded_root' depends on axioms: [propext, Classical.choice, Quot.sound]" rational-root-proof-output.txt
          grep -q "COERationalRoot.constant_slope_stable" rational-root-proof-output.txt
          grep -Fq "'COERationalRoot.selected_relu_sound_on_root_free_cell' depends on axioms: [propext, Classical.choice, Quot.sound]" rational-root-proof-output.txt
          grep -q "COERationalRoot.selected_at_root_zero" rational-root-proof-output.txt
          if grep -Eq 'sorryAx' rational-root-proof-output.txt; then
            cat rational-root-proof-output.txt
            exit 1
          fi
      - name: Prove executable root-exclusion guard implies rational sign stability
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean COE008Soundness.lean | tee root-guard-soundness.txt
          grep -Fq "'COE008Soundness.root_guard_implies_sign_stable' depends on axioms:" root-guard-soundness.txt
          if grep -Eq 'sorryAx|error:' root-guard-soundness.txt; then
            cat root-guard-soundness.txt
            exit 1
          fi
      - name: Prove symbolic layer propagation matches independent numeric network evaluation
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean COE008Evaluation.lean | tee evaluator-soundness.txt
          grep -Fq "'COE008Evaluation.verifiedCertificateSound' depends on axioms:" evaluator-soundness.txt
          if grep -Eq 'sorryAx|error:' evaluator-soundness.txt; then
            cat evaluator-soundness.txt
            exit 1
          fi
      - name: Prove intentionally false control is rejected
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          if lake env lean COECellInvalid.lean > invalid-proof-rejection.txt 2>&1; then
            cat invalid-proof-rejection.txt
            echo "Invalid false theorem compiled unexpectedly."
            exit 1
          fi
          grep -Eq 'error:|unsolved goals' invalid-proof-rejection.txt
      - name: Require rejection of an omitted-root-exclusion counterexample
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          if lake env lean COERootInvalid.lean > invalid-root-proof-rejection.txt 2>&1; then
            cat invalid-root-proof-rejection.txt
            echo "A false sign-stability result compiled without the root-exclusion premise."
            exit 1
          fi
          grep -Eq 'error:|unsolved goals' invalid-root-proof-rejection.txt
      - name: Require rejection of forged network semantics without a valid certificate
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          if lake env lean COE008Invalid.lean > invalid-semantic-claim.txt 2>&1; then
            echo "ERROR: Lean accepted a forged certificate for an identity network."
            exit 1
          fi
          grep -Fq 'Tactic `decide` failed for proposition' invalid-semantic-claim.txt
      - name: Retain Lean positive and negative proof observations
        uses: actions/upload-artifact@v4
        with:
          name: coe005-lean-kernel-cell-soundness
          path: |
            experiments/continuous-observation-equivalence/lean/proof-output.txt
            experiments/continuous-observation-equivalence/lean/rational-root-proof-output.txt
            experiments/continuous-observation-equivalence/lean/root-guard-soundness.txt
            experiments/continuous-observation-equivalence/lean/evaluator-soundness.txt
            experiments/continuous-observation-equivalence/lean/invalid-semantic-claim.txt
            experiments/continuous-observation-equivalence/lean/invalid-root-proof-rejection.txt
            experiments/continuous-observation-equivalence/lean/invalid-proof-rejection.txt
          if-no-files-found: error
