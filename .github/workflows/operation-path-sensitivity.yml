name: Operation path sensitivity

on:
  push:
    paths:
      - "experiments/operation-path-sensitivity/**"
      - "bridges/observation-path/operation_path_criticality.py"
      - "bridges/observation-path/operation_spans.py"
      - "bridges/observation-path/test_operation_path_criticality.py"
      - ".github/workflows/operation-path-sensitivity.yml"
  pull_request:
    paths:
      - "experiments/operation-path-sensitivity/**"
      - "bridges/observation-path/operation_path_criticality.py"
      - "bridges/observation-path/operation_spans.py"
      - "bridges/observation-path/test_operation_path_criticality.py"
      - ".github/workflows/operation-path-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source-span test dependency
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Verify sensitivity against exhaustive path enumeration
        run: python -m unittest discover -s experiments/operation-path-sensitivity -v
      - name: Verify source-span and path regression suites
        run: |
          python -m unittest discover -s bridges/observation-path -p test_operation_spans.py -v
          python -m unittest discover -s bridges/observation-path -p test_operation_path_criticality.py -v
