name: History-dependent representation relevance RIV-002

on:
  push:
    paths:
      - "experiments/history-dependent-representation-relevance/**"
      - ".github/workflows/history-dependent-representation-relevance.yml"
  pull_request:
    paths:
      - "experiments/history-dependent-representation-relevance/**"
      - ".github/workflows/history-dependent-representation-relevance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riv-002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile experiments/history-dependent-representation-relevance/history_dependent_relevance.py experiments/history-dependent-representation-relevance/example.py
      - name: Run focused tests
        run: python -m unittest discover -s experiments/history-dependent-representation-relevance -p 'test_*.py' -v
      - name: Reproduce example
        run: python experiments/history-dependent-representation-relevance/example.py
