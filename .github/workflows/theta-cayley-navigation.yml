name: TCN-001 Theta Cayley Navigation
on:
  push:
    paths:
      - 'experiments/theta_cayley_navigation/**'
      - '.github/workflows/theta-cayley-navigation.yml'
  pull_request:
    paths:
      - 'experiments/theta_cayley_navigation/**'
      - '.github/workflows/theta-cayley-navigation.yml'
  workflow_dispatch:
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.26'
      - run: python -m unittest discover -s experiments/theta_cayley_navigation -p 'test_*.py' -v
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python experiments/theta_cayley_navigation/run_experiment.py
        env:
          OPENBLAS_NUM_THREADS: '1'
