name: TCN-010 relation-constructed Grounds
on:
  push:
    branches: [main]
    paths:
      - 'experiments/quadratic_transfer_grounds/relational_ground.py'
      - 'experiments/quadratic_transfer_grounds/test_relational_ground.py'
      - 'experiments/quadratic_transfer_grounds/run_relational_ground.py'
      - 'experiments/quadratic_transfer_grounds/intention_ground.py'
      - 'experiments/quadratic_transfer_grounds/system_ground.py'
      - '.github/workflows/tcn010-relational-ground.yml'
  pull_request:
    paths:
      - 'experiments/quadratic_transfer_grounds/relational_ground.py'
      - 'experiments/quadratic_transfer_grounds/test_relational_ground.py'
      - 'experiments/quadratic_transfer_grounds/run_relational_ground.py'
      - '.github/workflows/tcn010-relational-ground.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy
      - name: New relational synthesis and prior regression tests
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s experiments/quadratic_transfer_grounds -p 'test_relational_ground.py' -v
          python -m unittest discover -s experiments/quadratic_transfer_grounds -p 'test_system_ground.py' -v
          python -m unittest discover -s experiments/quadratic_transfer_grounds -p 'test_intention_ground.py' -v
          python experiments/quadratic_transfer_grounds/run_relational_ground.py > /tmp/tcn010.json
          python -m json.tool /tmp/tcn010.json > /dev/null
