name: TCR-001 multi-host tensor-cut realization

on:
  push:
    branches: [main]
    paths:
      - 'experiments/tensor_cut_realization/**'
      - '.github/workflows/tensor-cut-realization.yml'
  pull_request:
    paths:
      - 'experiments/tensor_cut_realization/**'
      - '.github/workflows/tensor-cut-realization.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install numpy
      - name: Run numerical and actual E-CPU DAG tests
        env:
          PYTHONPATH: 'external/E-CPU'
        run: python -m unittest experiments.tensor_cut_realization.test_tensor_cut -v

  prepare-live:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy jsonschema
      - name: Pin and read four GPT-2 MLP source tensors; provision four shards
        run: python -m experiments.tensor_cut_realization.tensor_cut prepare --live --out prepared
      - uses: actions/upload-artifact@v4
        with:
          name: tcr-reference
          path: |
            prepared/manifest.json
            prepared/reference.npz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tcr-shard-0
          path: prepared/shard-0/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tcr-shard-1
          path: prepared/shard-1/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tcr-shard-2
          path: prepared/shard-2/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tcr-shard-3
          path: prepared/shard-3/
          if-no-files-found: error

  workers:
    needs: prepare-live
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: tcr-shard-${{ matrix.shard }}
          path: packet/
      - name: Execute one and only one hidden-neuron shard
        run: python -m experiments.tensor_cut_realization.tensor_cut worker --packet packet --out result
      - uses: actions/upload-artifact@v4
        with:
          name: tcr-result-${{ matrix.shard }}
          path: result/
          if-no-files-found: error

  aggregate:
    needs: workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: tcr-reference
          path: prepared/
      - uses: actions/download-artifact@v4
        with:
          pattern: tcr-result-*
          path: results/
          merge-multiple: true
      - name: Reconstruct E-CPU DAG, reduce and compare independent observations
        env:
          PYTHONPATH: 'external/E-CPU'
        run: python -m experiments.tensor_cut_realization.tensor_cut aggregate --prepared prepared --results results --out tcr-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: tcr-verified-report
          path: tcr-report.json
          if-no-files-found: error
