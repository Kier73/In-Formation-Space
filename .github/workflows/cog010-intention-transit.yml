name: COG-010 Intention-conditioned transit navigation
on:
  push:
    paths:
      - 'experiments/codonic-capability-atlas/**'
      - '.github/workflows/cog010-intention-transit.yml'
  pull_request:
    paths:
      - 'experiments/codonic-capability-atlas/**'
      - '.github/workflows/cog010-intention-transit.yml'
  workflow_dispatch:

# E-CPU IOS-003's HostedMeasurement type-check correction is pinned by its
# immutable Git commit, rather than assumed present on the older main branch.
# The source learner, native policy, and host transport remain distinct.

env:
  PYTHONPATH: 'external/E-CPU:experiments/codonic-capability-atlas'

jobs:
  native-ecpu-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 393462c6e0dafba8e0ee22946ae44227c5c6e4e6
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Native dependency and real mTLS receipt contract
        run: |
          python -m pip install 'cryptography>=43,<47' 'pytest>=8,<10'
          python -c 'from mailcpu.intention_sufficiency import FiniteGround,plan_sufficiency; from mailcpu.intention_measurement_fabric import MeasurementPeerClient,HostedMeasurement'
      - name: Native E-CPU IOS-003 regression (real socket, TLS and durable ledger)
        run: python -m pytest external/E-CPU/tests/test_intention_measurement_fabric.py -q
      - name: COG-010 direct signed worker tests and learned-Ground native mTLS integration
        run: |
          cd experiments/codonic-capability-atlas
          python -m unittest -v test_intention_transit.py test_native_ecpu_transit.py
      - name: Native intention selection and huge-tick fgraph state at 32 subjects
        run: |
          python experiments/codonic-capability-atlas/run_intention_transit.py prepare \
            --bundle cog010-32.json --trust cog010-32-trust.json \
            --pins cog010-32-pins.json --private-dir cog010-private \
            --subjects 32 --durations 8 --require-native
          python experiments/codonic-capability-atlas/run_intention_transit.py resume \
            --bundle cog010-32.json --trust cog010-32-trust.json \
            --pins cog010-32-pins.json --require-native

  prepare-verified-ground:
    runs-on: ubuntu-latest
    outputs:
      pins: ${{ steps.external-pin.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 393462c6e0dafba8e0ee22946ae44227c5c6e4e6
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Native finite planner, signed observer fault, structural orbit, checkpoint
        run: |
          python experiments/codonic-capability-atlas/run_intention_transit.py prepare \
            --bundle cog010-source.json --trust cog010-trust.json \
            --pins cog010-pins.json --private-dir cog010-operator-only-private \
            --subjects 8 --durations 4 --require-native
      - name: Retain signed source and Ground; exclude all private keys and pins
        uses: actions/upload-artifact@v4
        with:
          name: cog010-transit-source
          path: |
            cog010-source.json
            cog010-trust.json
          if-no-files-found: error
      - name: Transfer independently presented high-water pins
        id: external-pin
        shell: bash
        run: echo "json=$(cat cog010-pins.json)" >> "$GITHUB_OUTPUT"

  independently-reconstruct:
    needs: prepare-verified-ground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 393462c6e0dafba8e0ee22946ae44227c5c6e4e6
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=43,<47'
      - uses: actions/download-artifact@v4
        with:
          name: cog010-transit-source
      - name: Receiver-owned pin file (not read from signed-source artifact)
        env:
          EXTERNAL_PINS: ${{ needs.prepare-verified-ground.outputs.pins }}
        run: |
          python - <<'PY'
          import json,os
          pins=json.loads(os.environ['EXTERNAL_PINS'])
          open('cog010-pins.json','w').write(json.dumps(pins,sort_keys=True))
          PY
      - name: Verify source signatures and continue Ground without source host or private key
        run: |
          python experiments/codonic-capability-atlas/run_intention_transit.py resume \
            --bundle cog010-source.json --trust cog010-trust.json \
            --pins cog010-pins.json --require-native
