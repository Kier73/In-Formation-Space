name: Proof-runner completion receipts

on:
  push:
    paths:
      - "experiments/proof-runner-completion-receipts/**"
      - ".github/workflows/proof-runner-completion-receipts.yml"
  pull_request:
    paths:
      - "experiments/proof-runner-completion-receipts/**"
      - ".github/workflows/proof-runner-completion-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install receipt test dependencies
        run: python -m pip install --disable-pip-version-check "cryptography>=42,<47" "jsonschema>=4,<5"
      - name: Run signed completion receipt tests
        working-directory: experiments/proof-runner-completion-receipts
        run: python -m unittest discover -s . -p 'test_*.py' -v
