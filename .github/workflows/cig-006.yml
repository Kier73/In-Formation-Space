name: CIG-006 source-selected languages and hard-problem campaign

on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-006.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-006.yml'
  workflow_dispatch:

jobs:
  source-selected-grounds:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned NCR-007 actual Boolean-polynomial implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: navigable-compute-reference
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Entire CIG-001 through CIG-006 source audit
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Native PNG-001 SFI-002 OFG-003 NCR-007 cross-checks
        working-directory: experiments/pnp-ground-navigation/cut_intention
        env:
          PYTHONPATH: ${{ github.workspace }}/navigable-compute-reference
        run: python run_cig006_native.py
      - name: Reproduce deterministic heavyweight SAT and counting ledger
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python heavy_campaign.py --nodes 1200 --seconds 1.5
