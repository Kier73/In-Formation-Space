name: COG-003 evidence-discovered capability atlas
on:
  push:
    paths:
      - 'experiments/codonic-capability-atlas/**'
      - '.github/workflows/cog003-structural-discovery.yml'
  pull_request:
    paths:
      - 'experiments/codonic-capability-atlas/**'
      - '.github/workflows/cog003-structural-discovery.yml'
  workflow_dispatch:

jobs:
  discovery-and-refusal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact source, geometry, contextual transfer and tamper tests
        run: python -m unittest discover -s experiments/codonic-capability-atlas -p 'test_*.py' -v
      - name: Deterministic capacity-discovery ablation
        run: python experiments/codonic-capability-atlas/run_discovery.py

  native-vgi-discovered-operators:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned VGI native typed-operator authority
        run: python -m pip install 'git+https://github.com/Kier73/Virtual-Ground-Interpreter.git@e6e1900782aeede18a4de9046511bbba234dbc6e#subdirectory=virtual_ground_interpreter'
      - name: Hard-require native VGI type and receipt imports
        run: python -c 'from vgi.typed_operator_navigation import OperatorChain,homogeneous_affine_map,fulfill; from vgi.affine import ModularAffineMap; print("VGI native imports succeeded")'
      - name: Reconstruct learned Grounds and check real VGI operator receipts
        run: python -m unittest discover -s experiments/codonic-capability-atlas -p 'test_*.py' -v
