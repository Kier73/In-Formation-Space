name: Reference-calibrated evidence RIV-009

on:
  push:
    paths:
      - "experiments/reference-calibrated-evidence/**"
      - ".github/workflows/reference-calibrated-evidence.yml"
      - "experiments/calibration-aware-joint-evidence/calibration_aware_evidence.py"
  pull_request:
    paths:
      - "experiments/reference-calibrated-evidence/**"
      - ".github/workflows/reference-calibrated-evidence.yml"
      - "experiments/calibration-aware-joint-evidence/calibration_aware_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-calibrated-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Validate report schema
        run: |
          python -c "import json, jsonschema; p='experiments/reference-calibrated-evidence/reference-calibrated-evidence.schema.json'; s=json.load(open(p, encoding='utf-8')); jsonschema.Draft202012Validator.check_schema(s)"
      - name: Compile adapter and example
        run: |
          python -m py_compile experiments/reference-calibrated-evidence/reference_calibrated_evidence.py
          python -m py_compile experiments/reference-calibrated-evidence/example.py
          python -m py_compile experiments/calibration-aware-joint-evidence/calibration_aware_evidence.py
      - name: Run exact reference-calibration tests
        run: python -m unittest discover -s experiments/reference-calibrated-evidence -p "test_*.py" -v
      - name: Run reproducible example
        run: python experiments/reference-calibrated-evidence/example.py
