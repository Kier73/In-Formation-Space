name: COG-004 typed family discovery and mixed atlas
on:
  push:
    paths:
      - 'experiments/codonic-capability-atlas/**'
      - '.github/workflows/cog004-family-discovery.yml'
  pull_request:
    paths:
      - 'experiments/codonic-capability-atlas/**'
      - '.github/workflows/cog004-family-discovery.yml'
  workflow_dispatch:

jobs:
  exact-families:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: All source, rank, refusal and mixed capability tests
        run: python -m unittest discover -s experiments/codonic-capability-atlas -p 'test_*.py' -v
      - name: Reproduce two-family acquisition and contextual transfer
        run: python experiments/codonic-capability-atlas/run_family_discovery.py
  native-vgi-affine-factor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned native VGI typed algebra for affine factor
        run: python -m pip install 'git+https://github.com/Kier73/Virtual-Ground-Interpreter.git@e6e1900782aeede18a4de9046511bbba234dbc6e#subdirectory=virtual_ground_interpreter'
      - name: Hard require native VGI operators and affine receipts
        run: python -c 'from vgi.typed_operator_navigation import OperatorChain,homogeneous_affine_map,fulfill; from vgi.affine import ModularAffineMap; print("native VGI imports available")'
      - name: All exact tests including VGI typed factor cross-check
        run: python -m unittest discover -s experiments/codonic-capability-atlas -p 'test_*.py' -v
