name: Encounter envelope tests

on:
  push:
    paths:
      - "formats/encounter-envelope/**"
      - "experiments/description-to-realization/trials/trial-01-poset-interleaver/**"
      - "experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/**"
      - "experiments/guarded-shortcut-tradeoff/**"
      - ".github/workflows/encounter-envelope-tests.yml"
  pull_request:
    paths:
      - "formats/encounter-envelope/**"
      - "experiments/description-to-realization/trials/trial-01-poset-interleaver/**"
      - "experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/**"
      - "experiments/guarded-shortcut-tradeoff/**"
      - ".github/workflows/encounter-envelope-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional schema checker
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Run envelope tests
        run: python -m unittest discover -s formats/encounter-envelope -p "test_*.py" -v
      - name: Validate illustrative envelope
        run: python formats/encounter-envelope/validate_envelope.py formats/encounter-envelope/examples/tool-observation.json
      - name: Validate corrected benchmark encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/guarded-shortcut-tradeoff/results/tradeoff-v2-ci-run-11.json
      - name: Validate finite-description CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/results/test-encounter.json
      - name: Run Poset Interleaver property tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-01-poset-interleaver -p "test_*.py" -v
      - name: Run finite-description unbounded-space tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space -p "test_*.py" -v
      - name: Run corrected guarded-shortcut tests
        run: python -m unittest discover -s experiments/guarded-shortcut-tradeoff -p "test_*.py" -v
      - name: Execute corrected guarded-shortcut benchmark
        run: python experiments/guarded-shortcut-tradeoff/run_tradeoff_v2.py
