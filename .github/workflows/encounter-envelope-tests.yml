name: Encounter envelope tests

on:
  push:
    paths:
      - "formats/encounter-envelope/**"
      - "bridges/**"
      - "experiments/description-to-realization/trials/trial-01-poset-interleaver/**"
      - "experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/**"
      - "experiments/description-to-realization/trials/trial-03-distinction-refinement/**"
      - "experiments/description-to-realization/trials/trial-04-active-distinction-selection/**"
      - "experiments/description-to-realization/trials/trial-05-query-directed-attention/**"
      - "experiments/description-to-realization/trials/trial-06-adaptive-attention-policy/**"
      - "experiments/description-to-realization/trials/trial-07-epistemic-frontier/**"
      - "experiments/guarded-shortcut-tradeoff/**"
      - "experiments/logistic-map-coverage/**"
      - ".github/workflows/encounter-envelope-tests.yml"
  pull_request:
    paths:
      - "formats/encounter-envelope/**"
      - "bridges/**"
      - "experiments/description-to-realization/trials/trial-01-poset-interleaver/**"
      - "experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/**"
      - "experiments/description-to-realization/trials/trial-03-distinction-refinement/**"
      - "experiments/description-to-realization/trials/trial-04-active-distinction-selection/**"
      - "experiments/description-to-realization/trials/trial-05-query-directed-attention/**"
      - "experiments/description-to-realization/trials/trial-06-adaptive-attention-policy/**"
      - "experiments/description-to-realization/trials/trial-07-epistemic-frontier/**"
      - "experiments/guarded-shortcut-tradeoff/**"
      - "experiments/logistic-map-coverage/**"
      - ".github/workflows/encounter-envelope-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out pinned E-CPU runtime for live adapter integration
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 800f94f83ffd6f527ed093c8d1c1e93e153c34f6
          path: external/E-CPU
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional schema checker
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
      - name: Run envelope tests
        run: python -m unittest discover -s formats/encounter-envelope -p "test_*.py" -v
      - name: Validate illustrative envelope
        run: python formats/encounter-envelope/validate_envelope.py formats/encounter-envelope/examples/tool-observation.json
      - name: Validate corrected benchmark encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/guarded-shortcut-tradeoff/results/tradeoff-v2-ci-run-11.json
      - name: Validate finite-description CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/results/test-encounter.json
      - name: Validate distinction refinement CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-03-distinction-refinement/results/test-encounter.json
      - name: Validate active distinction selection CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-04-active-distinction-selection/results/test-encounter.json
      - name: Validate query-directed attention CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-05-query-directed-attention/results/test-encounter.json
      - name: Validate adaptive attention policy CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-06-adaptive-attention-policy/results/test-encounter.json
      - name: Validate bridge encounter
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-equivalence/results/bridge-encounter.json
      - name: Validate repeated-return logistic scan encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/logistic-map-coverage/results/coverage-v2-ci-run-31.json
      - name: Run observation-equivalence demonstration
        run: python bridges/observation-equivalence/demonstration.py
      - name: Run observation-equivalence bridge tests
        run: python -m unittest discover -s bridges/observation-equivalence -p "test_*.py" -v
      - name: Validate illustrative observation-path record
        run: python bridges/observation-path/validate_observation_path.py bridges/observation-path/examples/happy-path.json
      - name: Validate observation-path CI receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-path/results/ci-run-112.json
      - name: Validate live E-CPU integration receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-path/results/live-ecpu-integration-run-217.json
      - name: Validate live E-CPU temporal analysis receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-path/results/live-ecpu-temporal-analysis-run-242.json
      - name: Validate hypothesis-revision CI receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/hypothesis-revision/results/ci-run-131.json
      - name: Run evidence-gated observation path tests
        run: python -m unittest discover -s bridges/observation-path -p "test_observation_path.py" -v
      - name: Run observation-path schema and lifecycle tests
        run: python -m unittest discover -s bridges/observation-path -p "test_validate_observation_path.py" -v
      - name: Run adaptive policy execution bridge tests
        run: python -m unittest discover -s bridges/observation-path -p "test_adaptive_policy_execution.py" -v
      - name: Run E-CPU gated adapter contract tests
        run: python -m unittest discover -s bridges/observation-path -p "test_ecpu_gated_adapter.py" -v
      - name: Run typed E-CPU temporal binding tests
        run: python -m unittest discover -s bridges/observation-path -p "test_ecpu_temporal_binding.py" -v
      - name: Run conservative temporal analysis tests
        run: python -m unittest discover -s bridges/observation-path -p "test_temporal_binding_analysis.py" -v
      - name: Run live E-CPU gated observation integration
        env:
          PYTHONPATH: external/E-CPU
          ECPU_ROOT: external/E-CPU
        run: python bridges/observation-path/ecpu_live_integration.py
      - name: Run append-only hypothesis revision tests
        run: python -m unittest discover -s bridges/hypothesis-revision -p "test_*.py" -v
      - name: Run Poset Interleaver property tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-01-poset-interleaver -p "test_*.py" -v
      - name: Run finite-description unbounded-space tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space -p "test_*.py" -v
      - name: Run distinction refinement tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-03-distinction-refinement -p "test_*.py" -v
      - name: Run active distinction selection tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-04-active-distinction-selection -p "test_*.py" -v
      - name: Run query-directed attention tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-05-query-directed-attention -p "test_*.py" -v
      - name: Run adaptive attention policy tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-06-adaptive-attention-policy -p "test_*.py" -v
      - name: Run epistemic frontier tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-07-epistemic-frontier -p "test_*.py" -v
      - name: Validate epistemic frontier encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-07-epistemic-frontier/results/test-encounter.json
      - name: Run corrected guarded-shortcut tests
        run: python -m unittest discover -s experiments/guarded-shortcut-tradeoff -p "test_*.py" -v
      - name: Execute corrected guarded-shortcut benchmark
        run: python experiments/guarded-shortcut-tradeoff/run_tradeoff_v2.py
      - name: Run original logistic-map coverage invariants
        run: python -m unittest discover -s experiments/logistic-map-coverage -p "test_scan_coverage.py" -v
      - name: Run repeated-return logistic-map tests
        run: python -m unittest discover -s experiments/logistic-map-coverage -p "test_scan_coverage_v2.py" -v
      - name: Execute repeated-return logistic-map scan
        run: python experiments/logistic-map-coverage/scan_coverage_v2.py --samples 20000
