name: Encounter envelope tests

on:
  push:
    paths:
      - "formats/encounter-envelope/**"
      - "bridges/**"
      - "experiments/description-to-realization/trials/trial-01-poset-interleaver/**"
      - "experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/**"
      - "experiments/description-to-realization/trials/trial-03-distinction-refinement/**"
      - "experiments/description-to-realization/trials/trial-04-active-distinction-selection/**"
      - "experiments/description-to-realization/trials/trial-05-query-directed-attention/**"
      - "experiments/description-to-realization/trials/trial-06-adaptive-attention-policy/**"
      - "experiments/description-to-realization/trials/trial-07-epistemic-frontier/**"
      - "experiments/guarded-shortcut-tradeoff/**"
      - "experiments/logistic-map-coverage/**"
      - "experiments/observation-cost-information/**"
      - "experiments/ecpu-reliable-observation-recovery/**"
      - "experiments/authority-adjudication-space/**"
      - "experiments/ecpu-epistemic-authority-finalization/**"
      - ".github/workflows/encounter-envelope-tests.yml"
  pull_request:
    paths:
      - "formats/encounter-envelope/**"
      - "bridges/**"
      - "experiments/description-to-realization/trials/trial-01-poset-interleaver/**"
      - "experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/**"
      - "experiments/description-to-realization/trials/trial-03-distinction-refinement/**"
      - "experiments/description-to-realization/trials/trial-04-active-distinction-selection/**"
      - "experiments/description-to-realization/trials/trial-05-query-directed-attention/**"
      - "experiments/description-to-realization/trials/trial-06-adaptive-attention-policy/**"
      - "experiments/description-to-realization/trials/trial-07-epistemic-frontier/**"
      - "experiments/guarded-shortcut-tradeoff/**"
      - "experiments/logistic-map-coverage/**"
      - "experiments/observation-cost-information/**"
      - "experiments/ecpu-reliable-observation-recovery/**"
      - "experiments/authority-adjudication-space/**"
      - "experiments/ecpu-epistemic-authority-finalization/**"
      - ".github/workflows/encounter-envelope-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out pinned E-CPU runtime for live adapter integration
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 800f94f83ffd6f527ed093c8d1c1e93e153c34f6
          path: external/E-CPU
      - name: Check out pinned VGI runtime for partial-attention interoperability
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: cedcc4540a9d75228cf83aaf21e1ba960fe8a555
          path: external/Virtual-Ground-Interpreter
      - name: Check out pinned VGI policy planner for context attention
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ac13c1bbd92dfd09f17de51adef7adb2d2088bf6
          path: external/Virtual-Ground-Interpreter-context-policy
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema and signature dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5" "cryptography>=42,<50"
      - name: Run envelope tests
        run: python -m unittest discover -s formats/encounter-envelope -p "test_*.py" -v
      - name: Validate illustrative envelope
        run: python formats/encounter-envelope/validate_envelope.py formats/encounter-envelope/examples/tool-observation.json
      - name: Validate corrected benchmark encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/guarded-shortcut-tradeoff/results/tradeoff-v2-ci-run-11.json
      - name: Validate finite-description CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space/results/test-encounter.json
      - name: Validate distinction refinement CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-03-distinction-refinement/results/test-encounter.json
      - name: Validate active distinction selection CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-04-active-distinction-selection/results/test-encounter.json
      - name: Validate query-directed attention CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-05-query-directed-attention/results/test-encounter.json
      - name: Validate adaptive attention policy CI encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-06-adaptive-attention-policy/results/test-encounter.json
      - name: Validate bridge encounter
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-equivalence/results/bridge-encounter.json
      - name: Validate repeated-return logistic scan encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/logistic-map-coverage/results/coverage-v2-ci-run-31.json
      - name: Run observation-equivalence demonstration
        run: python bridges/observation-equivalence/demonstration.py
      - name: Run observation-equivalence bridge tests
        run: python -m unittest discover -s bridges/observation-equivalence -p "test_*.py" -v
      - name: Run clock-domain temporal provenance tests
        run: python -m unittest discover -s bridges/temporal-provenance -p "test_*.py" -v
      - name: Run direct pinned E-CPU temporal-frame interoperability test
        env:
          PYTHONPATH: external/E-CPU
        run: python -m unittest discover -s bridges/temporal-provenance -p "test_ecpu_temporal_interop.py" -v
      - name: Generate clock-domain temporal provenance example
        run: python bridges/temporal-provenance/demonstration.py --output "${{ runner.temp }}/temporal-provenance-example.json"
      - name: Upload clock-domain temporal provenance example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clock-domain-temporal-provenance
          path: ${{ runner.temp }}/temporal-provenance-example.json
          if-no-files-found: warn
      - name: Generate bounded affine clock calibration example
        run: python bridges/temporal-provenance/clock_calibration.py --output "${{ runner.temp }}/clock-calibration-example.json"
      - name: Upload bounded affine clock calibration example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-affine-clock-calibration
          path: ${{ runner.temp }}/clock-calibration-example.json
          if-no-files-found: warn
      - name: Generate two-sided clock calibration example
        run: python bridges/temporal-provenance/clock_calibration_v2_demo.py --output "${{ runner.temp }}/clock-calibration-v2-example.json"
      - name: Upload two-sided clock calibration example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-sided-clock-calibration
          path: ${{ runner.temp }}/clock-calibration-v2-example.json
          if-no-files-found: warn
      - name: Validate illustrative observation-path record
        run: python bridges/observation-path/validate_observation_path.py bridges/observation-path/examples/happy-path.json
      - name: Validate observation-path CI receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-path/results/ci-run-112.json
      - name: Validate live E-CPU integration receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-path/results/live-ecpu-integration-run-217.json
      - name: Validate live E-CPU temporal analysis receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/observation-path/results/live-ecpu-temporal-analysis-run-242.json
      - name: Validate hypothesis-revision CI receipt
        run: python formats/encounter-envelope/validate_envelope.py bridges/hypothesis-revision/results/ci-run-131.json
      - name: Run evidence-gated observation path tests
        run: python -m unittest discover -s bridges/observation-path -p "test_observation_path.py" -v
      - name: Run observation-path schema and lifecycle tests
        run: python -m unittest discover -s bridges/observation-path -p "test_validate_observation_path.py" -v
      - name: Run adaptive policy execution bridge tests
        run: python -m unittest discover -s bridges/observation-path -p "test_adaptive_policy_execution.py" -v
      - name: Run VGI context-attention policy bridge tests
        env:
          PYTHONPATH: external/Virtual-Ground-Interpreter-context-policy/virtual_ground_interpreter
        run: python -m unittest discover -s bridges/observation-path -p "test_context_attention.py" -v
      - name: Run authorized context-measurement evidence tests
        env:
          PYTHONPATH: external/Virtual-Ground-Interpreter-context-policy/virtual_ground_interpreter
        run: python -m unittest discover -s bridges/observation-path -p "test_context_measurement.py" -v
      - name: Run evidence-gated decision-value context acquisition tests
        env:
          PYTHONPATH: bridges/observation-path:experiments/decision-value-context-acquisition
        run: python -m unittest discover -s experiments/decision-value-context-acquisition -p "test_*.py" -v
      - name: Run VGI partial-probe evidence-path interoperability tests
        env:
          PYTHONPATH: external/Virtual-Ground-Interpreter/virtual_ground_interpreter:bridges/hypothesis-revision
        run: python -m unittest discover -s bridges/observation-path -p "test_partial_probe_execution.py" -v
      - name: Run VGI partial-attention navigation coordinator tests
        env:
          PYTHONPATH: external/Virtual-Ground-Interpreter/virtual_ground_interpreter:bridges/hypothesis-revision
        run: python -m unittest discover -s bridges/observation-path -p "test_partial_attention_navigator.py" -v
      - name: Run E-CPU gated adapter contract tests
        run: python -m unittest discover -s bridges/observation-path -p "test_ecpu_gated_adapter.py" -v
      - name: Run typed E-CPU temporal binding tests
        run: python -m unittest discover -s bridges/observation-path -p "test_ecpu_temporal_binding.py" -v
      - name: Run conservative temporal analysis tests
        run: python -m unittest discover -s bridges/observation-path -p "test_temporal_binding_analysis.py" -v
      - name: Run operation-span and empirical cost profile tests
        run: python -m unittest discover -s bridges/observation-path -p "test_operation_spans.py" -v
      - name: Run empirical partial-probe cost binding tests
        env:
          PYTHONPATH: external/Virtual-Ground-Interpreter/virtual_ground_interpreter:bridges/observation-path:bridges/hypothesis-revision
        run: python -m unittest discover -s bridges/observation-path -p "test_empirical_probe_costs.py" -v
      - name: Run observation-outcome information ledger tests
        run: python -m unittest discover -s bridges/observation-path -p "test_observation_outcomes.py" -v
      - name: Run controlled observation cost-information matrix tests
        run: python -m unittest discover -s experiments/observation-cost-information -p "test_*.py" -v
      - name: Run E-CPU reliable observation recovery tests
        run: python -m unittest discover -s experiments/ecpu-reliable-observation-recovery -p "test_*.py" -v
      - name: Run authority adjudication policy-space tests
        run: python -m unittest discover -s experiments/authority-adjudication-space -p "test_*.py" -v
      - name: Run E-CPU epistemic authority finalization tests
        env:
          PYTHONPATH: external/E-CPU
          ECPU_ROOT: external/E-CPU
        run: python -m unittest discover -s experiments/ecpu-epistemic-authority-finalization -p "test_*.py" -v
      - name: Run live E-CPU gated observation integration
        env:
          PYTHONPATH: external/E-CPU
          ECPU_ROOT: external/E-CPU
          OPERATION_SPAN_OUTPUT_DIR: ${{ runner.temp }}/ecpu-operation-spans
        run: python bridges/observation-path/ecpu_live_integration.py
      - name: Run controlled E-CPU observation cost-information matrix
        env:
          PYTHONPATH: external/E-CPU
          ECPU_ROOT: external/E-CPU
        run: python experiments/observation-cost-information/run_experiment.py --output-dir "${{ runner.temp }}/ecpu-observation-cost-information"
      - name: Run E-CPU reliable observation loss and recovery matrix
        env:
          PYTHONPATH: external/E-CPU
          ECPU_ROOT: external/E-CPU
        run: python experiments/ecpu-reliable-observation-recovery/run_recovery_matrix.py --output-dir "${{ runner.temp }}/ecpu-reliable-observation-recovery"
      - name: Enumerate authority adjudication policy space
        run: python experiments/authority-adjudication-space/run_adjudication_space.py --output-dir "${{ runner.temp }}/authority-adjudication-policy-space"
      - name: Upload authority adjudication policy-space artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-adjudication-policy-space
          path: ${{ runner.temp }}/authority-adjudication-policy-space/
          if-no-files-found: warn
      - name: Run E-CPU epistemic authority and finalization matrix
        env:
          PYTHONPATH: external/E-CPU
          ECPU_ROOT: external/E-CPU
        run: python experiments/ecpu-epistemic-authority-finalization/run_authority_matrix.py --output-dir "${{ runner.temp }}/ecpu-epistemic-authority-finalization"
      - name: Enumerate exhaustive finite authority policy space
        run: python experiments/ecpu-epistemic-authority-finalization/run_policy_space.py --output-dir "${{ runner.temp }}/ecpu-epistemic-policy-space"
      - name: Upload exhaustive authority policy space artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecpu-epistemic-policy-space
          path: ${{ runner.temp }}/ecpu-epistemic-policy-space/
          if-no-files-found: warn
      - name: Upload E-CPU epistemic authority artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecpu-epistemic-authority-finalization
          path: ${{ runner.temp }}/ecpu-epistemic-authority-finalization/
          if-no-files-found: warn
      - name: Upload E-CPU reliable observation recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecpu-reliable-observation-recovery
          path: ${{ runner.temp }}/ecpu-reliable-observation-recovery/
          if-no-files-found: warn
      - name: Upload controlled observation cost-information artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecpu-observation-cost-information-experiment
          path: ${{ runner.temp }}/ecpu-observation-cost-information/
          if-no-files-found: warn
      - name: Upload live E-CPU operation-span artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ecpu-operation-spans
          path: ${{ runner.temp }}/ecpu-operation-spans/
          if-no-files-found: warn
      - name: Run append-only authority lineage tests
        run: python -m unittest discover -s bridges/authority-lineage -p "test_*.py" -v
      - name: Generate authority lineage fork and merge example
        run: python bridges/authority-lineage/demonstration.py --output "${{ runner.temp }}/authority-lineage-example.json"
      - name: Upload authority lineage example artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-lineage-fork-merge-example
          path: ${{ runner.temp }}/authority-lineage-example.json
          if-no-files-found: warn
      - name: Generate certificate-backed authority review example
        run: python bridges/authority-lineage/review_certificate_demo.py --output "${{ runner.temp }}/authority-review-certificate-example.json"
      - name: Upload authority review certificate example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-review-certificate-example
          path: ${{ runner.temp }}/authority-review-certificate-example.json
          if-no-files-found: warn
      - name: Generate signed authority review receipt example
        run: python bridges/authority-lineage/signed_review_demo.py --output "${{ runner.temp }}/signed-authority-review-example.json"
      - name: Upload signed authority review receipt example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-signed-review-receipts
          path: ${{ runner.temp }}/signed-authority-review-example.json
          if-no-files-found: warn
      - name: Generate signed-review authority ledger example
        run: python bridges/authority-lineage/signed_review_ledger_demo.py --output "${{ runner.temp }}/signed-review-ledger-example.json"
      - name: Upload signed-review authority ledger example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-signed-review-ledger
          path: ${{ runner.temp }}/signed-review-ledger-example.json
          if-no-files-found: warn
      - name: Generate root-signed reviewer trust manifest example
        run: python bridges/authority-lineage/review_trust_manifest_demo.py --output "${{ runner.temp }}/review-trust-manifest-example.json"
      - name: Upload root-signed reviewer trust manifest example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-review-trust-manifest
          path: ${{ runner.temp }}/review-trust-manifest-example.json
          if-no-files-found: warn
      - name: Generate dual-authorized root rotation example
        run: python bridges/authority-lineage/review_root_rotation_demo.py --output "${{ runner.temp }}/review-root-rotation-example.json"
      - name: Upload dual-authorized root rotation example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-review-root-rotation
          path: ${{ runner.temp }}/review-root-rotation-example.json
          if-no-files-found: warn
      - name: Run append-only hypothesis revision tests
        run: python -m unittest discover -s bridges/hypothesis-revision -p "test_*.py" -v
      - name: Run Poset Interleaver property tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-01-poset-interleaver -p "test_*.py" -v
      - name: Run finite-description unbounded-space tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-02-finite-description-unbounded-space -p "test_*.py" -v
      - name: Run distinction refinement tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-03-distinction-refinement -p "test_*.py" -v
      - name: Run active distinction selection tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-04-active-distinction-selection -p "test_*.py" -v
      - name: Run query-directed attention tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-05-query-directed-attention -p "test_*.py" -v
      - name: Run adaptive attention policy tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-06-adaptive-attention-policy -p "test_*.py" -v
      - name: Run epistemic frontier tests
        run: python -m unittest discover -s experiments/description-to-realization/trials/trial-07-epistemic-frontier -p "test_*.py" -v
      - name: Validate epistemic frontier encounter
        run: python formats/encounter-envelope/validate_envelope.py experiments/description-to-realization/trials/trial-07-epistemic-frontier/results/test-encounter.json
      - name: Run corrected guarded-shortcut tests
        run: python -m unittest discover -s experiments/guarded-shortcut-tradeoff -p "test_*.py" -v
      - name: Execute corrected guarded-shortcut benchmark
        run: python experiments/guarded-shortcut-tradeoff/run_tradeoff_v2.py
      - name: Run original logistic-map coverage invariants
        run: python -m unittest discover -s experiments/logistic-map-coverage -p "test_scan_coverage.py" -v
      - name: Run repeated-return logistic-map tests
        run: python -m unittest discover -s experiments/logistic-map-coverage -p "test_scan_coverage_v2.py" -v
      - name: Execute repeated-return logistic-map scan
        run: python experiments/logistic-map-coverage/scan_coverage_v2.py --samples 20000
