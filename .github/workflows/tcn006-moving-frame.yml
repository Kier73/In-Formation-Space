name: TCN-006 moving-frame echo and receipts
on:
  push:
    paths:
      - 'experiments/quadratic_transfer_grounds/moving_frame.py'
      - 'experiments/quadratic_transfer_grounds/receipt.py'
      - 'experiments/quadratic_transfer_grounds/test_moving_frame.py'
      - 'experiments/quadratic_transfer_grounds/test_moving_frame_receipt.py'
      - 'experiments/quadratic_transfer_grounds/run_moving_frame.py'
      - 'experiments/quadratic_transfer_grounds/MOVING_FRAME.md'
      - 'experiments/quadratic_transfer_grounds/cocycle.py'
      - '.github/workflows/tcn006-moving-frame.yml'
  pull_request:
    paths:
      - 'experiments/quadratic_transfer_grounds/**'
      - '.github/workflows/tcn006-moving-frame.yml'
  workflow_dispatch:
jobs:
  numerical-and-exact-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy
      - name: Verify algebraic moving-frame and refusal tests
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s experiments/quadratic_transfer_grounds -p 'test_moving_frame.py' -v
      - name: Verify independent short-circuit witnesses and tamper refusals
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s experiments/quadratic_transfer_grounds -p 'test_moving_frame_receipt.py' -v
      - name: Run deterministic phase-echo experiment
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/quadratic_transfer_grounds/run_moving_frame.py > /tmp/tcn006.json
