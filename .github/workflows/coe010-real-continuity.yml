name: COE-010 exact real extension via mathlib

on:
  pull_request:
    paths:
      - 'experiments/continuous-observation-equivalence/lean/**'
      - 'experiments/continuous-observation-equivalence/real-lean/**'
      - 'experiments/continuous-observation-equivalence/README.md'
      - '.github/workflows/coe010-real-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/continuous-observation-equivalence/lean/**'
      - 'experiments/continuous-observation-equivalence/real-lean/**'
      - 'experiments/continuous-observation-equivalence/README.md'
      - '.github/workflows/coe010-real-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-continuous-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import exact already kernel-checked COE sources
        run: |
          cp experiments/continuous-observation-equivalence/lean/COE*.lean \
             experiments/continuous-observation-equivalence/real-lean/
          sha256sum experiments/continuous-observation-equivalence/lean/COE*.lean \
            > experiments/continuous-observation-equivalence/real-lean/rational-source-sha256.txt
      - name: Install the pinned Lean 4.24 toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/continuous-observation-equivalence/real-lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve the pinned mathlib revision
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = \
            "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"
      - name: Restore pinned mathlib binary cache
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: lake exe cache get
      - name: Compile independent real semantics and original COE proof chain
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: lake build COE012RealLink COE011Fixtures
      - name: Kernel-check real continuity, exact casts and dense uniqueness
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          lake env lean COE010Real.lean | tee real-extension-proof-output.txt
          grep -Fq "'COE010Real.unique_continuous_real_extension' depends on axioms: [propext, Classical.choice, Quot.sound]" real-extension-proof-output.txt
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' real-extension-proof-output.txt; then
            cat real-extension-proof-output.txt
            exit 1
          fi
      - name: Verify actual accepted certificate has a unique real meaning
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          lake env lean COE010Network.lean | tee real-network-soundness.txt
          grep -Fq "'COE010Network.acceptedCertificateHasUniqueRealMeaning' depends on axioms: [propext, Classical.choice, Quot.sound]" real-network-soundness.txt
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' real-network-soundness.txt; then
            cat real-network-soundness.txt
            exit 1
          fi
      - name: Kernel-check the actual certificate cells on all real coordinates
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          lake env lean COE011Atlas.lean | tee real-atlas-soundness.txt
          grep -Fq "'COE011Atlas.verifiedCellRealSound' depends on axioms: [propext, Classical.choice, Quot.sound]" real-atlas-soundness.txt
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' real-atlas-soundness.txt; then
            cat real-atlas-soundness.txt
            exit 1
          fi
      - name: Kernel-check direct piecewise real certificate interpretation and continuity
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          lake env lean COE011Coverage.lean | tee real-piecewise-network-soundness.txt
          for theorem in verifiedRealCover overlappingCellsAgree piecewiseReal_eq_network continuous_piecewiseReal piecewiseReal_at_rational; do
            grep -Fq "'COE011Coverage.${theorem}' depends on axioms: [propext, Classical.choice, Quot.sound]" real-piecewise-network-soundness.txt
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' real-piecewise-network-soundness.txt; then
            cat real-piecewise-network-soundness.txt
            exit 1
          fi
      - name: Kernel-check exact two-cell seam fixture and real interpretation
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          lake env lean COE011Fixtures.lean | tee real-piecewise-fixtures.txt
          grep -Fq "'COE011Fixtures.identitySplitReal' depends on axioms: [propext, Classical.choice, Quot.sound]" real-piecewise-fixtures.txt
          grep -Fq "'COE011Fixtures.gappedSplitRejected' depends on axioms: [propext, Classical.choice, Quot.sound]" real-piecewise-fixtures.txt
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' real-piecewise-fixtures.txt; then
            cat real-piecewise-fixtures.txt
            exit 1
          fi
      - name: Kernel-prove decoded wire certificates inherit all-real atlas semantics
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          lake env lean COE012RealLink.lean | tee real-wire-semantic-proof.txt
          for theorem in acceptedWireAllReal acceptedWireContinuous fractionalWireAllReal; do
            grep -Fq "'COE012RealLink.${theorem}' depends on axioms: [propext, Classical.choice, Quot.sound]" real-wire-semantic-proof.txt
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' real-wire-semantic-proof.txt; then
            cat real-wire-semantic-proof.txt
            exit 1
          fi
      - name: Require kernel rejection of a gapped activation-cell cover
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          if lake env lean COE011Invalid.lean > invalid-piecewise-cover.txt 2>&1; then
            echo "ERROR: Lean accepted a gapped rational activation-cell cover"
            exit 1
          fi
          cat invalid-piecewise-cover.txt
          grep -Fq 'Tactic `decide` proved that the proposition' invalid-piecewise-cover.txt
          grep -Fq 'verify COE011Fixtures.gappedSplit = true' invalid-piecewise-cover.txt
          grep -Fq 'is false' invalid-piecewise-cover.txt
      - name: Require rejection of a false all-real ReLU observation
        working-directory: experiments/continuous-observation-equivalence/real-lean
        run: |
          if lake env lean COE010Invalid.lean > invalid-real-extension.txt 2>&1; then
            echo "A false all-real ReLU identity was accepted"
            exit 1
          fi
          grep -Eq 'error:|unsolved goals' invalid-real-extension.txt
      - name: Retain source fingerprints, kernel and negative-control evidence
        uses: actions/upload-artifact@v4
        with:
          name: coe010-mathlib-real-extension-evidence
          path: |
            experiments/continuous-observation-equivalence/real-lean/rational-source-sha256.txt
            experiments/continuous-observation-equivalence/real-lean/real-extension-proof-output.txt
            experiments/continuous-observation-equivalence/real-lean/real-network-soundness.txt
            experiments/continuous-observation-equivalence/real-lean/real-atlas-soundness.txt
            experiments/continuous-observation-equivalence/real-lean/real-piecewise-network-soundness.txt
            experiments/continuous-observation-equivalence/real-lean/real-piecewise-fixtures.txt
            experiments/continuous-observation-equivalence/real-lean/real-wire-semantic-proof.txt
            experiments/continuous-observation-equivalence/real-lean/invalid-piecewise-cover.txt
            experiments/continuous-observation-equivalence/real-lean/invalid-real-extension.txt
          if-no-files-found: error
