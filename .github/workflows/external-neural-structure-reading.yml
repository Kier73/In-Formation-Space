name: External neural structure reading HFR-001

on:
  push:
    paths:
      - "experiments/external_neural_structure_reading/**"
      - ".github/workflows/external-neural-structure-reading.yml"
  pull_request:
    paths:
      - "experiments/external_neural_structure_reading/**"
      - ".github/workflows/external-neural-structure-reading.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hfr-001:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema numpy

      - name: Compile observer
        run: python -m compileall -q experiments/external_neural_structure_reading

      - name: Run offline NSD observer tests
        run: >-
          python -m unittest discover
          -s experiments/external_neural_structure_reading
          -p 'test_*.py'
          -v
