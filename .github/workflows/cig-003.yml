name: CIG-003 nonlinear observer cut Grounds

on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-003.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/pnp-ground-navigation/cut_intention/**'
      - '.github/workflows/cig-003.yml'
  workflow_dispatch:

jobs:
  source-and-cross-repo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Pinned NCR-007 mathematical implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/Navigable-Compute
          ref: 66e216e53ab606547ba4a5316ed44044e327b67b
          path: navigable-compute-reference
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact original-CNF replay including predecessor regressions
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Native PNG, SFI, OFG and pinned NCR integration (no fallback)
        working-directory: experiments/pnp-ground-navigation/cut_intention
        env:
          PYTHONPATH: ${{ github.workspace }}/navigable-compute-reference
        run: python run_cross_repo.py
      - name: Reproduce bounded intention-specific cost ledger
        working-directory: experiments/pnp-ground-navigation/cut_intention
        run: python run_nonlinear_observer.py
