name: OFG-001/002/003 observer-fiber navigation
on:
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/observer_fibers/**'
      - '.github/workflows/ofg-observer-fibers.yml'
  push:
    paths:
      - 'experiments/pnp-ground-navigation/observer_fibers/**'
      - '.github/workflows/ofg-observer-fibers.yml'
  workflow_dispatch:
jobs:
  source-bound-fibers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independently verify all observer-fiber constructions
        working-directory: experiments/pnp-ground-navigation/observer_fibers
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Reproduce separator-conditioned source and witness cost ledger
        working-directory: experiments/pnp-ground-navigation/observer_fibers
        run: python run_separator_fiber_ground.py
      - name: Reproduce frontier-derived observation acquisition policies
        working-directory: experiments/pnp-ground-navigation/observer_fibers
        run: python run_frontier_observation_planner.py
