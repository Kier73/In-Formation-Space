name: RE-015 credential continuity, witness checkpoints and E-CPU recovery

on:
  pull_request:
    paths:
      - 'experiments/response-equivalence/**'
      - '.github/workflows/re015-credential-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/response-equivalence/**'
      - '.github/workflows/re015-credential-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install public-key verification dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - name: Run complete response equivalence regression suite
        run: python -m unittest discover -s experiments/response-equivalence -p 'test_*.py' -v
      - name: Check exact RE-015 report regeneration
        run: |
          python experiments/response-equivalence/credential_continuity.py > /tmp/re015-rebuilt.json
          cmp experiments/response-equivalence/re015_report.json /tmp/re015-rebuilt.json
      - name: Exercise pinned real E-CPU temporal integration
        env: {PYTHONPATH: 'external/E-CPU:experiments/response-equivalence'}
        run: python experiments/response-equivalence/ecpu_re015_cases.py

  enrollment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - name: Create synthetic trust genesis and reconstruct preissued RE-014 history
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'experiments/response-equivalence')
          from credential_continuity import enrollment,issue_baseline
          reg=enrollment()
          def save(name,x):
              with open(name,'w',encoding='utf-8') as out:json.dump(x,out,sort_keys=True)
          save('re015-trust.json',{'trust':reg['trust'],'replacement_public':reg['replacement_public']})
          save('re015-baseline.json',issue_baseline())
          save('re015-rotation-keys.json',{x:reg['private'][x] for x in ('R0','W1','W2')})
          save('re015-revocation-keys.json',{x:reg['private'][x] for x in ('R1','W1','W2')})
          for w in ('W1','W2'):save('re015-'+w+'-key.json',reg['private'][w])
          PY
      - uses: actions/upload-artifact@v4
        with: {name: re015-trust-public, path: re015-trust.json, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-re014-history-ci, path: re015-baseline.json, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-rotation-ci-keys, path: re015-rotation-keys.json, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-revocation-ci-keys, path: re015-revocation-keys.json, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-W1-ci-key, path: re015-W1-key.json, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-W2-ci-key, path: re015-W2-key.json, retention-days: 1, if-no-files-found: error}

  rotation-Q:
    needs: enrollment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Kier73/E-CPU, ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65, path: external/E-CPU}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - uses: actions/download-artifact@v4
        with: {name: re015-trust-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-re014-history-ci}
      - uses: actions/download-artifact@v4
        with: {name: re015-rotation-ci-keys}
      - name: Rotate R0 to R1 and bind real E-CPU causal source frame
        env: {PYTHONPATH: 'external/E-CPU:experiments/response-equivalence'}
        run: |
          python - <<'PY'
          import json
          def read(p):
              with open(p) as f:return json.load(f)
          pub=read('re015-trust.json')
          with open('request.json','w') as f:json.dump({'baseline':read('re015-baseline.json'),
              'trust':pub['trust'],'replacement_public':pub['replacement_public'],
              'private':read('re015-rotation-keys.json'),'db':'re015-governance.sqlite3'},f)
          PY
          python experiments/response-equivalence/ecpu_re015_hosts.py --rotate request.json > re015-rotated.json
      - uses: actions/upload-artifact@v4
        with: {name: re015-rotated-public, path: re015-rotated.json, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-rotated-sqlite, path: re015-governance.sqlite3, if-no-files-found: error}

  revocation-R:
    needs: [enrollment, rotation-Q]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Kier73/E-CPU, ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65, path: external/E-CPU}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - uses: actions/download-artifact@v4
        with: {name: re015-trust-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-re014-history-ci}
      - uses: actions/download-artifact@v4
        with: {name: re015-rotated-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-rotated-sqlite}
      - uses: actions/download-artifact@v4
        with: {name: re015-revocation-ci-keys}
      - name: Resume authority from SQLite and revoke with rotated signer
        env: {PYTHONPATH: 'external/E-CPU:experiments/response-equivalence'}
        run: |
          python - <<'PY'
          import json
          def read(p):
              with open(p) as f:return json.load(f)
          with open('request.json','w') as f:json.dump({'baseline':read('re015-baseline.json'),
              'trust':read('re015-trust.json')['trust'],'private':read('re015-revocation-keys.json'),
              'rotated':read('re015-rotated.json'),'db':'re015-governance.sqlite3'},f)
          PY
          python experiments/response-equivalence/ecpu_re015_hosts.py --revoke request.json > re015-revoked.json
      - uses: actions/upload-artifact@v4
        with: {name: re015-revoked-public, path: re015-revoked.json, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-revoked-sqlite, path: re015-governance.sqlite3, if-no-files-found: error}

  witness-W1:
    needs: [enrollment, rotation-Q, revocation-R]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Kier73/E-CPU, ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65, path: external/E-CPU}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - uses: actions/download-artifact@v4
        with: {name: re015-trust-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-re014-history-ci}
      - uses: actions/download-artifact@v4
        with: {name: re015-rotated-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-revoked-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-W1-ci-key}
      - name: Independently retain W1 signed checkpoint history in distinct SQLite database
        env: {PYTHONPATH: 'external/E-CPU:experiments/response-equivalence'}
        run: |
          python - <<'PY'
          import json
          def read(p):
              with open(p) as f:return json.load(f)
          with open('request.json','w') as f:json.dump({'baseline':read('re015-baseline.json'),
              'trust':read('re015-trust.json')['trust'],'rotated':read('re015-rotated.json'),
              'revoked':read('re015-revoked.json'),'private':read('re015-W1-key.json'),
              'db':'re015-W1.sqlite3'},f)
          PY
          python experiments/response-equivalence/ecpu_re015_hosts.py --W1 request.json > re015-W1.json
      - uses: actions/upload-artifact@v4
        with: {name: re015-W1-public, path: re015-W1.json, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-W1-sqlite, path: re015-W1.sqlite3, if-no-files-found: error}

  witness-W2:
    needs: [enrollment, rotation-Q, revocation-R]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Kier73/E-CPU, ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65, path: external/E-CPU}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - uses: actions/download-artifact@v4
        with: {name: re015-trust-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-re014-history-ci}
      - uses: actions/download-artifact@v4
        with: {name: re015-rotated-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-revoked-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-W2-ci-key}
      - name: Independently retain W2 checkpoint history and causal continuation
        env: {PYTHONPATH: 'external/E-CPU:experiments/response-equivalence'}
        run: |
          python - <<'PY'
          import json
          def read(p):
              with open(p) as f:return json.load(f)
          with open('request.json','w') as f:json.dump({'baseline':read('re015-baseline.json'),
              'trust':read('re015-trust.json')['trust'],'rotated':read('re015-rotated.json'),
              'revoked':read('re015-revoked.json'),'private':read('re015-W2-key.json'),
              'db':'re015-W2.sqlite3'},f)
          PY
          python experiments/response-equivalence/ecpu_re015_hosts.py --W2 request.json > re015-W2.json
      - uses: actions/upload-artifact@v4
        with: {name: re015-W2-public, path: re015-W2.json, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: re015-W2-sqlite, path: re015-W2.sqlite3, if-no-files-found: error}

  independent-replay:
    needs: [unit-tests, rotation-Q, revocation-R, witness-W1, witness-W2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Kier73/E-CPU, ref: c99af8c927fcbb7ff6f7e8a2d6489fd1489e7b65, path: external/E-CPU}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
      - uses: actions/download-artifact@v4
        with: {name: re015-trust-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-re014-history-ci}
      - uses: actions/download-artifact@v4
        with: {name: re015-rotated-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-revoked-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-revoked-sqlite}
      - uses: actions/download-artifact@v4
        with: {name: re015-W1-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-W2-public}
      - uses: actions/download-artifact@v4
        with: {name: re015-W1-sqlite}
      - uses: actions/download-artifact@v4
        with: {name: re015-W2-sqlite}
      - name: Recover revoked certificate from the journal and two external SQLite witnesses
        env: {PYTHONPATH: 'external/E-CPU:experiments/response-equivalence'}
        run: |
          python - <<'PY'
          import json
          def read(p):
              with open(p) as f:return json.load(f)
          with open('request.json','w') as f:json.dump({'baseline':read('re015-baseline.json'),
              'trust':read('re015-trust.json')['trust'],
              'rotated':read('re015-rotated.json'),'revoked':read('re015-revoked.json'),
              'witnesses':{'W1':read('re015-W1.json'),'W2':read('re015-W2.json')},
              'db':'re015-governance.sqlite3',
              'witness_sqlite':{'W1':'re015-W1.sqlite3','W2':'re015-W2.sqlite3'}},f)
          PY
          python experiments/response-equivalence/ecpu_re015_hosts.py --verify request.json > re015-independent-verification.json
          python - <<'PY'
          import json
          with open('re015-independent-verification.json') as f:out=json.load(f)
          assert out['reconstructed']['status']=='revoked',out
          assert out['reconstructed']['issuer_host_online'] is False,out
          assert out['reconstructed']['legacy_re014_hmac_verification_key_required'] is True,out
          assert out['causal_relations']=={'Q_before_R':'before','R_before_W1':'before',
              'R_before_W2':'before','W1_concurrent_W2':'concurrent'},out
          assert out['external_hardware_identity_attested'] is False,out
          print('Independent verifier reproduced rotated signer and revocation under two external SQLite anchors')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: re015-independent-verification, path: re015-independent-verification.json, if-no-files-found: error}