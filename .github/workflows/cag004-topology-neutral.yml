              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Verify both real TLS transcripts and adversarial tampering without phase
        run: |
          if test -e evidence/cag004/gci003-private.json; then
            echo "Private phase leaked to independent blind auditor" >&2
            exit 1
          fi
          python experiments/cross-ground-continuity/gci005/test_live_report.py --directory evidence/cag004
          python experiments/cross-ground-continuity/gci005/honesty_contract.py blind --directory evidence/cag004
      - name: Attest gci005-phase-blind-disagreement-refusal on main
