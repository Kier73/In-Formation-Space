name: CAG-004 topology-neutral internal and remote E-CPU realization

on:
  pull_request:
    paths:
      - 'experiments/convergent-ground-fabric/cag004/**'
      - 'experiments/cross-ground-continuity/gci001/**'
      - 'experiments/cross-ground-continuity/gci002/**'
      - 'experiments/cross-ground-continuity/gci003/**'
      - '.github/workflows/cag004-topology-neutral.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/convergent-ground-fabric/cag004/**'
      - 'experiments/cross-ground-continuity/gci001/**'
      - 'experiments/cross-ground-continuity/gci002/**'
      - 'experiments/cross-ground-continuity/gci003/**'
      - '.github/workflows/cag004-topology-neutral.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ed25519 contract checker
        run: python -m pip install "cryptography>=43,<47"
      - name: Validate signed intention, independent oracle and resource-forgery controls
        run: |
          python -m unittest discover -s experiments/convergent-ground-fabric/cag004 -p 'test_contract.py' -v
          python -m py_compile experiments/convergent-ground-fabric/cag004/contract.py experiments/convergent-ground-fabric/cag004/hosts.py
      - name: Test cross-Ground contracts and adversarial observer contexts
        run: |
          python -m unittest discover -s experiments/cross-ground-continuity/gci001 -p 'test_continuity.py' -v
          python -m py_compile experiments/cross-ground-continuity/gci001/continuity.py experiments/cross-ground-continuity/gci001/vgi_host.py
      - name: Exercise GCI-002 orbit-source and observer-refusal adversarial controls
        run: |
          python -m unittest discover -s experiments/cross-ground-continuity/gci002 -p 'test_contract.py' -v
          python -m py_compile experiments/cross-ground-continuity/gci002/ground_contract.py experiments/cross-ground-continuity/gci002/ecpu_orbit_probe.py experiments/cross-ground-continuity/gci002/vgi_closed_orbit.py
      - name: Check intention-relative observer sufficiency, phase separation and fail-closed plans
        run: |
          python -m unittest discover -s experiments/cross-ground-continuity/gci003 -p 'test_intention_model.py' -v
          python -m py_compile experiments/cross-ground-continuity/gci003/intention_model.py experiments/cross-ground-continuity/gci003/phase_holder.py experiments/cross-ground-continuity/gci003/measurement_host.py

  intent_host:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signature primitive
        run: python -m pip install "cryptography>=43,<47"
      - name: Create bounded intention with ephemeral signing key
        run: |
          python experiments/convergent-ground-fabric/cag004/contract.py issue --directory evidence/cag004
      - name: Attest source intention on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/signed-intent.json
      - name: Attest distinct trust bootstrap on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/issuer-trust.json
      - uses: actions/upload-artifact@v4
        with:
          name: cag004-signed-intention
          path: |
            evidence/cag004/signed-intent.json
            evidence/cag004/issuer-trust.json
          if-no-files-found: error
          retention-days: 90

  internal_loci_host:
    needs: [tests, intent_host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact E-CPU PR 120 SHN-001 experimental implementation
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3a81f1c386b1fc223cc0aec354c099c8c1f717a5
          path: external/E-CPU-SHN
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real E-CPU experimental SHN implementation and signature checker
        run: |
          python -m pip install "cryptography>=43,<47"
          python -m pip install -e external/E-CPU-SHN
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - name: Verify exact workflow-scope source attestation on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Observe exactly one interpreter, three virtual hosts and restart at each handoff
        run: |
          python experiments/convergent-ground-fabric/cag004/hosts.py internal --directory evidence/cag004
      - name: Attest exact internal host report on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/internal-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cag004-internal-observer-report
          path: evidence/cag004/internal-report.json
          retention-days: 90
          if-no-files-found: error

  receiver_host:
    needs: [tests, intent_host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned independently authorized E-CPU main runtime
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU-Receiver
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install receiver-owned E-CPU and signature checker
        run: |
          python -m pip install "cryptography>=43,<47"
          python -m pip install -e external/E-CPU-Receiver
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - name: Verify exact workflow-scope source attestation on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Independently run receiver-local mathematical operator under E-CPU Hypervisor
        run: |
          python experiments/convergent-ground-fabric/cag004/hosts.py receiver --directory evidence/cag004
      - name: Attest exact separate receiver report on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/receiver-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cag004-receiver-observer-report
          path: evidence/cag004/receiver-report.json
          retention-days: 90
          if-no-files-found: error

  verifier_host:
    needs: [tests, intent_host, internal_loci_host, receiver_host]
    if: needs.tests.result == 'success' && needs.intent_host.result == 'success' && needs.internal_loci_host.result == 'success' && needs.receiver_host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pure independent verifier dependencies, not E-CPU runtime
        run: python -m pip install "cryptography>=43,<47"
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: cag004-internal-observer-report
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: cag004-receiver-observer-report
          path: evidence/cag004
      - name: Verify workflow-attested source, trust and two host reports on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json internal-report.json receiver-report.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Independently check common intention, three observer topologies and resource truthfulness
        run: |
          python experiments/convergent-ground-fabric/cag004/contract.py verify --directory evidence/cag004
      - name: Attest independent topology audit on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/auditor-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cag004-independent-topology-audit
          path: evidence/cag004/auditor-report.json
          retention-days: 90
          if-no-files-found: error

  vgi_ground_host:
    needs: [tests, intent_host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned independent VGI affine realization
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: 093f11e458aff1c223d639ede413000619767ba6
          path: external/VGI
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install VGI and source signature verifier
        run: |
          python -m pip install "cryptography>=43,<47"
          python -m pip install -e external/VGI/virtual_ground_interpreter
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - name: Require actual workflow attestations for source and trust on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Execute exact 2D and quotient modular-affine Grounds in real VGI
        run: |
          python experiments/cross-ground-continuity/gci001/vgi_host.py --directory evidence/cag004
      - name: Attest actual VGI execution report on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/vgi-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: gci001-vgi-ground-report
          path: evidence/cag004/vgi-report.json
          if-no-files-found: error
          retention-days: 90

  continuity_verifier:
    needs: [tests, intent_host, internal_loci_host, receiver_host, verifier_host, vgi_ground_host]
    if: needs.tests.result == 'success' && needs.intent_host.result == 'success' && needs.internal_loci_host.result == 'success' && needs.receiver_host.result == 'success' && needs.verifier_host.result == 'success' && needs.vgi_ground_host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only independent signature verifier, NOT E-CPU or VGI
        run: python -m pip install "cryptography>=43,<47"
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: cag004-internal-observer-report
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: cag004-receiver-observer-report
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: gci001-vgi-ground-report
          path: evidence/cag004
      - name: Require exact main-workflow attestations for all input reports
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json internal-report.json receiver-report.json vgi-report.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Reconstruct CAG-004 and VGI agreement without either execution runtime
        run: |
          python experiments/cross-ground-continuity/gci001/continuity.py verify --directory evidence/cag004
      - name: Attest independently reconstructed cross-Ground audit on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/continuity-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: gci001-cross-ground-audit
          path: evidence/cag004/continuity-audit.json
          if-no-files-found: error
          retention-days: 90

  ecpu_orbit_probe_host:
    needs: [tests, intent_host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out independently pinned E-CPU law navigator
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU-OrbitProbe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual E-CPU module and signature checker
        run: |
          python -m pip install "cryptography>=43,<47"
          python -m pip install -e external/E-CPU-OrbitProbe
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - name: Verify original workflow-attested source and trust on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Calculate eight actual E-CPU affine orbit observations
        run: |
          python experiments/cross-ground-continuity/gci002/ecpu_orbit_probe.py --directory evidence/cag004
      - name: Attest eight-edge E-CPU observed report on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/orbit-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: gci002-ecpu-eight-edge-orbit-probe
          path: evidence/cag004/orbit-probe.json
          if-no-files-found: error
          retention-days: 90

  vgi_certified_ground_host:
    needs: [tests, intent_host, ecpu_orbit_probe_host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact independent VGI transition and affine certificate runtime
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: 093f11e458aff1c223d639ede413000619767ba6
          path: external/VGI
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real VGI and signed-intent checker
        run: |
          python -m pip install "cryptography>=43,<47"
          python -m pip install -e external/VGI/virtual_ground_interpreter
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: gci002-ecpu-eight-edge-orbit-probe
          path: evidence/cag004
      - name: Check source key and eight E-CPU edge report attestations on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json orbit-probe.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Admit explicit source evidence, fail closed on missing edge, certify complete VGI orbit
        run: |
          python experiments/cross-ground-continuity/gci002/vgi_closed_orbit.py --directory evidence/cag004
      - name: Attest actual evidence-admitted VGI closed-orbit certificate on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/closed-orbit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: gci002-vgi-closed-orbit-certificate
          path: evidence/cag004/closed-orbit-report.json
          if-no-files-found: error
          retention-days: 90

  gci002_independent_verifier:
    needs: [continuity_verifier, ecpu_orbit_probe_host, vgi_certified_ground_host]
    if: needs.continuity_verifier.result == 'success' && needs.ecpu_orbit_probe_host.result == 'success' && needs.vgi_certified_ground_host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only signature verifier, NOT E-CPU or VGI
        run: python -m pip install "cryptography>=43,<47"
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: cag004-internal-observer-report
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: cag004-receiver-observer-report
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: gci001-vgi-ground-report
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: gci002-ecpu-eight-edge-orbit-probe
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: gci002-vgi-closed-orbit-certificate
          path: evidence/cag004
      - name: Check source, both E-CPU paths and both VGI reports for main-workflow attestations
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json internal-report.json receiver-report.json vgi-report.json orbit-probe.json closed-orbit-report.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json >/dev/null
          done
      - name: Reconstruct all CAG-004, GCI-001, GCI-002 source and certificate claims without source runtimes
        run: |
          python experiments/cross-ground-continuity/gci002/ground_contract.py verify --directory evidence/cag004
      - name: Attest independent eight-edge closure and observer refusal on main
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: evidence/cag004/gci002-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: gci002-independent-observer-ground-audit
          path: evidence/cag004/gci002-audit.json
          if-no-files-found: error
          retention-days: 90

  gci003_phase_holder:
    needs: [tests, gci002_independent_verifier]
    if: needs.tests.result == 'success' && needs.gci002_independent_verifier.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned receiver-owned E-CPU navigator
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU-GCI003
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real E-CPU and source signature checker
        run: |
          python -m pip install "cryptography>=43,<47"
          python -m pip install -e external/E-CPU-GCI003
      - uses: actions/download-artifact@v4
        with:
          name: cag004-signed-intention
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: gci002-ecpu-eight-edge-orbit-probe
          path: evidence/cag004
      - uses: actions/download-artifact@v4
        with:
          name: gci002-vgi-closed-orbit-certificate
          path: evidence/cag004
      - name: Require original mathematical source and VGI Ground attestations on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in signed-intent.json issuer-trust.json orbit-probe.json closed-orbit-report.json; do
            gh attestation verify "evidence/cag004/$file" \
              --repo Kier73/In-Formation-Space \
              --signer-workflow Kier73/In-Formation-Space/.github/workflows/cag004-topology-neutral.yml \
