name: PNG-003 proof-carrying nonlocal grounds
on:
  push:
    paths:
      - 'experiments/pnp-ground-navigation/**'
      - '.github/workflows/png003.yml'
  pull_request:
    paths:
      - 'experiments/pnp-ground-navigation/**'
      - '.github/workflows/png003.yml'
jobs:
  proof-ground-regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run PNG-001/002/003 regression suite
        working-directory: experiments/pnp-ground-navigation
        run: python -m unittest -v test_frontier_ground.py test_algebraic_ground.py test_derived_ground.py
      - name: Verify PNG-003 campaign and receipts
        working-directory: experiments/pnp-ground-navigation
        run: |
          python run_png003.py --write-receipts
          python derived_verifier.py receipts_png003/non-twin-implication-23.json
          python derived_verifier.py receipts_png003/two-guards-dense-98.json
