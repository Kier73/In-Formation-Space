      - uses: actions/download-artifact@v4
        with:
          name: coe016-test-only-cross-evidence-receipt
          path: experiments/continuous-observation-equivalence/received-coe016
      - uses: actions/download-artifact@v4
        with:
          name: coe017-public-demo-untrusted-verifier-attestation
          path: experiments/continuous-observation-equivalence/received-verifier-attestation
      - uses: actions/download-artifact@v4
        with:
          name: coe018-public-demo-untrusted-journal
