  coe018-independent-receiver-convergence:
    needs: [coe018-receiver-a, coe018-receiver-b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: coe018-receiver-a-reconstruction
          path: receiver-a
      - uses: actions/download-artifact@v4
        with:
          name: coe018-receiver-b-reconstruction
          path: receiver-b
      - name: Compare separately produced authority states without trusting either summary
        run: |
          cmp receiver-a/receiver-a.json receiver-b/receiver-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("receiver-a/receiver-a.json").read_bytes())
          assert r["schema"] == "ifs.coe018.independent-authority-replay/v1"
          assert r["journal_count"] == 3 and r["final_sequence"] == 5
          assert r["status"] == "revoked-under-policy" and r["receipt_revoked"] is True
          assert r["active_signers"] == ["demo-vr-41", "demo-vr-74"]
          assert r["compared_expected_anchor"] is True
          assert r["external_anchor_authenticated"] is False
          assert r["real_world_identity_authenticated"] is False
          assert r["ground_admitted"] is False
          print("COE-018: independently reconstructed verifier decisions agree")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coe018-independent-receiver-comparison
          path: |
            receiver-a/receiver-a.json
            receiver-b/receiver-b.json
          if-no-files-found: error

  coe018-authority-unit:
    # Fast exact-head feedback, independent of the long Lean proving chain.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Go authority journal and adversarial independence/replay matrix
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: go test -count=1 -v ./history ./cmd/history-demo ./cmd/history-verify
