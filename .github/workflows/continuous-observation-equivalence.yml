name: COE-001 continuous observation equivalence

on:
  pull_request:
    paths:
      - 'experiments/continuous-observation-equivalence/**'
      - '.github/workflows/continuous-observation-equivalence.yml'
  push:
    paths:
      - 'experiments/continuous-observation-equivalence/**'
      - '.github/workflows/continuous-observation-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-relu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact rational atlases and adversarial controls
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_continuous_equivalence test_certificate_checker -v
      - name: Emit deterministic equivalence evidence
        working-directory: experiments/continuous-observation-equivalence
        run: python run_experiment.py > continuous-equivalence-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: coe001-continuous-equivalence-report
          path: experiments/continuous-observation-equivalence/continuous-equivalence-report.json
          if-no-files-found: error

  certificate-producer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build typed activation-cell certificates
        working-directory: experiments/continuous-observation-equivalence
        run: python produce_certificates.py certificate-artifacts
      - name: Retain untrusted producer certificates
        uses: actions/upload-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/certificate-artifacts/*.json
          if-no-files-found: error

  certificate-checker:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download certificate claims from separate producer job
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Verify all-real intervals independently against pinned model identities
        working-directory: experiments/continuous-observation-equivalence
        run: python verify_certificates.py received-certificates --output independent-certificate-report.json
      - name: Run adversarial certificate rejection tests
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest discover -s . -p 'test_certificate_checker.py' -v
      - name: Retain independent checker receipt
        uses: actions/upload-artifact@v4
        with:
          name: coe002-independent-checker-report
          path: experiments/continuous-observation-equivalence/independent-certificate-report.json
          if-no-files-found: error

  go-certificate-checker:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Download Python-produced certificates
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Test Go verifier with adversarial mutations of Python certificates
        working-directory: experiments/continuous-observation-equivalence
        env:
          COE_CERT_DIR: ${{ github.workspace }}/experiments/continuous-observation-equivalence/received-certificates
        run: go test -v go_checker/main.go go_checker/main_test.go
      - name: Independently check exact rational cover, source and semantic digests in Go
        working-directory: experiments/continuous-observation-equivalence
        run: go run go_checker/main.go received-certificates > go-independent-check-report.json
      - name: Retain independent Go verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: coe003-go-independent-checker-report
          path: experiments/continuous-observation-equivalence/go-independent-check-report.json
          if-no-files-found: error

  ground-link-producer:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Receive mathematically checkable source certificates
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Create E-CPU typed candidate Ground and observation translation references
        working-directory: experiments/continuous-observation-equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/external/E-CPU
        run: python ground_binding_producer.py received-certificates ground-link-artifacts --ecpu-dir "${{ github.workspace }}/external/E-CPU"
      - name: Transfer untrusted candidate Ground links
        uses: actions/upload-artifact@v4
        with:
          name: coe004-ground-link-artifacts
          path: experiments/continuous-observation-equivalence/ground-link-artifacts/*.json
          if-no-files-found: error

  ground-link-verifier:
    needs: [certificate-producer, ground-link-producer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Receive original certificates
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Receive produced Ground identity links
        uses: actions/download-artifact@v4
        with:
          name: coe004-ground-link-artifacts
          path: experiments/continuous-observation-equivalence/received-ground-links
      - name: Independent reconstruction with pinned E-CPU contracts
        working-directory: experiments/continuous-observation-equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/external/E-CPU
        run: python ground_binding_verifier.py received-certificates received-ground-links --ecpu-dir "${{ github.workspace }}/external/E-CPU" --output independent-ground-link-report.json
      - name: Adversarial Ground, observer and contract substitution tests
        working-directory: experiments/continuous-observation-equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/external/E-CPU
        run: python -m unittest discover -s . -p 'test_ground_binding.py' -v
      - name: Retain independently reconstructed Ground link report
        uses: actions/upload-artifact@v4
        with:
          name: coe004-ground-link-verifier-report
          path: experiments/continuous-observation-equivalence/independent-ground-link-report.json
          if-no-files-found: error

  lean-certificate-replay:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build independently checked Lean source with pinned toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/continuous-observation-equivalence/lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Receive exact Python producer certificates for Lean replay
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Verify canonical transport, source manifest and adversarial generator
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_lean_certificate_bridge -v
      - name: Translate only pinned certificate bytes into literal Lean inputs
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python emit_lean_certificates.py received-certificates lean/GeneratedCertificateProofs.lean --manifest lean/lean-replay-manifest.json
      - name: Kernel-reduce all five exact rational source certificates
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean GeneratedCertificateProofs.lean | tee lean-certificates-proof-output.txt
          for name in identity relu_identity zero triangular_bump rescaled_bump; do
            grep -Fq "theorem $name""_arith_verified" GeneratedCertificateProofs.lean
          done
          if grep -Eq 'sorryAx|error:' lean-certificates-proof-output.txt; then
            cat lean-certificates-proof-output.txt
            exit 1
          fi
      - name: Test untrusted string-only wire transport
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_lean_wire -v
      - name: Transport original string tokens separately from rational literals
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python emit_lean_wire.py received-certificates lean/GeneratedWireProofs.lean --manifest lean/lean-wire-replay-manifest.json
      - name: Kernel-decode wire tokens and prove equality to original five typed certificates
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean -o .lake/build/lib/lean/GeneratedCertificateProofs.olean GeneratedCertificateProofs.lean > lean-certificate-olean-output.txt
          lake env lean GeneratedWireProofs.lean | tee lean-wire-token-proof-output.txt
          for name in identity relu_identity zero triangular_bump rescaled_bump; do
            grep -Fq "'COE012.${name}_wire_decoded' depends on axioms:" lean-wire-token-proof-output.txt
            grep -Fq "'COE012.${name}_wire_verified' depends on axioms:" lean-wire-token-proof-output.txt
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' lean-wire-token-proof-output.txt; then
            cat lean-wire-token-proof-output.txt
            exit 1
          fi
      - name: Test direct raw JSON byte transport without Python JSON interpretation
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_lean_json_bytes -v
      - name: Carry complete original canonical JSON file bytes into Lean
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python emit_lean_json_bytes.py received-certificates lean/GeneratedJSONProofs.lean --manifest lean/lean-json-replay-manifest.json
      - name: Kernel-parse entire original JSON structure for all five certificates
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean -o .lake/build/lib/lean/GeneratedWireProofs.olean GeneratedWireProofs.lean > lean-wire-olean-output.txt
          lake env lean GeneratedJSONProofs.lean | tee lean-json-byte-proof-output.txt
          for name in identity relu_identity zero triangular_bump rescaled_bump; do
            grep -Fq "'COE013.${name}_json_wire' does not depend on any axioms" lean-json-byte-proof-output.txt
            grep -Fq "'COE013.${name}_json_admitted' depends on axioms: [propext, Classical.choice, Quot.sound]" lean-json-byte-proof-output.txt
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' lean-json-byte-proof-output.txt; then
            cat lean-json-byte-proof-output.txt
            exit 1
          fi
      - name: Require kernel rejection of malformed duplicate-key JSON proof
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          if lake env lean COE013Invalid.lean > invalid-json-byte-proof.txt 2>&1; then
            echo "ERROR: Lean accepted duplicate JSON keys"
            exit 1
          fi
          cat invalid-json-byte-proof.txt
          grep -Fq 'Tactic `decide` proved that the proposition' invalid-json-byte-proof.txt
          grep -Fq 'parseEnvelope duplicateKey ≠ none' invalid-json-byte-proof.txt
          grep -Fq 'is false' invalid-json-byte-proof.txt
      - name: Require Lean kernel rejection of noncanonical rational wire admission
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          if lake env lean COE012WireInvalid.lean > invalid-wire-token.txt 2>&1; then
            echo "ERROR: Lean accepted an unreduced wire fraction"
            exit 1
          fi
          cat invalid-wire-token.txt
          grep -Fq 'Tactic `decide` proved that the proposition' invalid-wire-token.txt
          grep -Fq 'acceptWire unreduced = true' invalid-wire-token.txt
          grep -Fq 'is false' invalid-wire-token.txt
      - name: Construct negative certificates without altering source network hashes
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python make_lean_negative_certificates.py received-certificates lean-negative-artifacts
          for case in hidden-root wrong-slope cover-gap; do
            python emit_lean_certificates.py "lean-negative-artifacts/$case" "lean/Negative-$case.lean"
          done
      - name: Require Lean kernel rejection of all three corrupt certificate claims
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          for case in hidden-root wrong-slope cover-gap; do
            if lake env lean "Negative-$case.lean" > "negative-$case-rejection.txt" 2>&1; then
              echo "ERROR: Lean accepted corrupted $case certificate."
              exit 1
            fi
            grep -Eq 'error:|unsolved goals' "negative-$case-rejection.txt"
          done
      - name: Retain transported source identities and independent Lean results
        uses: actions/upload-artifact@v4
        with:
          name: coe007-lean-certificate-replay
          path: |
            experiments/continuous-observation-equivalence/lean/lean-replay-manifest.json
            experiments/continuous-observation-equivalence/lean/GeneratedCertificateProofs.lean
            experiments/continuous-observation-equivalence/lean/lean-certificates-proof-output.txt
            experiments/continuous-observation-equivalence/lean/lean-wire-replay-manifest.json
            experiments/continuous-observation-equivalence/lean/GeneratedWireProofs.lean
            experiments/continuous-observation-equivalence/lean/lean-certificate-olean-output.txt
            experiments/continuous-observation-equivalence/lean/lean-wire-token-proof-output.txt
            experiments/continuous-observation-equivalence/lean/lean-json-replay-manifest.json
            experiments/continuous-observation-equivalence/lean/GeneratedJSONProofs.lean
            experiments/continuous-observation-equivalence/lean/lean-json-byte-proof-output.txt
            experiments/continuous-observation-equivalence/lean/invalid-json-byte-proof.txt
            experiments/continuous-observation-equivalence/lean/lean-wire-olean-output.txt
            experiments/continuous-observation-equivalence/lean/invalid-wire-token.txt
            experiments/continuous-observation-equivalence/lean/negative-*-rejection.txt
          if-no-files-found: error
