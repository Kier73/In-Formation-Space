name: COE-001 continuous observation equivalence

on:
  pull_request:
    paths:
      - 'experiments/continuous-observation-equivalence/**'
      - '.github/workflows/continuous-observation-equivalence.yml'
  push:
    paths:
      - 'experiments/continuous-observation-equivalence/**'
      - '.github/workflows/continuous-observation-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-relu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact rational atlases and adversarial controls
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_continuous_equivalence test_certificate_checker -v
      - name: Emit deterministic equivalence evidence
        working-directory: experiments/continuous-observation-equivalence
        run: python run_experiment.py > continuous-equivalence-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: coe001-continuous-equivalence-report
          path: experiments/continuous-observation-equivalence/continuous-equivalence-report.json
          if-no-files-found: error

  certificate-producer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build typed activation-cell certificates
        working-directory: experiments/continuous-observation-equivalence
        run: python produce_certificates.py certificate-artifacts
      - name: Retain untrusted producer certificates
        uses: actions/upload-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/certificate-artifacts/*.json
          if-no-files-found: error

  signed-manifest-producer:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Download untrusted original certificate claims
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Generate public TEST-ONLY multi-signed source manifest
        working-directory: experiments/continuous-observation-equivalence/coe015_auth
        run: go run ./cmd/demo ../received-certificates ../unsigned-authority-claims
      - name: Transfer untrusted multi-signed demo manifest
        uses: actions/upload-artifact@v4
        with:
          name: coe015-untrusted-signed-manifest
          path: experiments/continuous-observation-equivalence/unsigned-authority-claims/signed-manifest.json
          if-no-files-found: error

  signed-manifest-verifier:
    needs: [certificate-producer, signed-manifest-producer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Receive original certificate bytes from producer
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Receive untrusted signed source-manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: coe015-untrusted-signed-manifest
          path: experiments/continuous-observation-equivalence/received-authority-claims
      - name: Test Ed25519 signature quorum, key rotation, revocation and byte tampering
        working-directory: experiments/continuous-observation-equivalence/coe015_auth
        run: go test -count=1 -v ./...
      - name: Verify signed authority against RECEIVER-owned test public-key policy and original bytes
        working-directory: experiments/continuous-observation-equivalence/coe015_auth
        run: |
          go run ./cmd/verify \
            -policy demo-policy.json \
            -signed ../received-authority-claims/signed-manifest.json \
            -certs ../received-certificates \
            -allow-demo \
            -report signed-authority-receipt.json
          grep -Fq '"ground_admitted":false' signed-authority-receipt.json
          grep -Fq '"origin_authenticated":false' signed-authority-receipt.json
          grep -Fq '"policy_mode":"test-only"' signed-authority-receipt.json
      - name: Require demonstration policy to be REFUSED without explicit opt-in
        working-directory: experiments/continuous-observation-equivalence/coe015_auth
        run: |
          if go run ./cmd/verify \
             -policy demo-policy.json \
             -signed ../received-authority-claims/signed-manifest.json \
             -certs ../received-certificates \
             > demo-authority-refusal.txt 2>&1; then
            echo 'ERROR: public demo keys were silently accepted as production authority'
            exit 1
          fi
          grep -Fq 'demo keys are not production authority' demo-authority-refusal.txt
      - name: Preserve independent source authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: coe015-demo-signature-authority-evidence
          path: |
            experiments/continuous-observation-equivalence/coe015_auth/signed-authority-receipt.json
            experiments/continuous-observation-equivalence/coe015_auth/demo-authority-refusal.txt
          if-no-files-found: error

  certificate-checker:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download certificate claims from separate producer job
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Verify all-real intervals independently against pinned model identities
        working-directory: experiments/continuous-observation-equivalence
        run: python verify_certificates.py received-certificates --output independent-certificate-report.json
      - name: Run adversarial certificate rejection tests
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest discover -s . -p 'test_certificate_checker.py' -v
      - name: Retain independent checker receipt
        uses: actions/upload-artifact@v4
        with:
          name: coe002-independent-checker-report
          path: experiments/continuous-observation-equivalence/independent-certificate-report.json
          if-no-files-found: error

  go-certificate-checker:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Download Python-produced certificates
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Test Go verifier with adversarial mutations of Python certificates
        working-directory: experiments/continuous-observation-equivalence
        env:
          COE_CERT_DIR: ${{ github.workspace }}/experiments/continuous-observation-equivalence/received-certificates
        run: go test -v go_checker/main.go go_checker/main_test.go
      - name: Independently check exact rational cover, source and semantic digests in Go
        working-directory: experiments/continuous-observation-equivalence
        run: go run go_checker/main.go received-certificates > go-independent-check-report.json
      - name: Retain independent Go verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: coe003-go-independent-checker-report
          path: experiments/continuous-observation-equivalence/go-independent-check-report.json
          if-no-files-found: error

  ground-link-producer:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Receive mathematically checkable source certificates
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Create E-CPU typed candidate Ground and observation translation references
        working-directory: experiments/continuous-observation-equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/external/E-CPU
        run: python ground_binding_producer.py received-certificates ground-link-artifacts --ecpu-dir "${{ github.workspace }}/external/E-CPU"
      - name: Transfer untrusted candidate Ground links
        uses: actions/upload-artifact@v4
        with:
          name: coe004-ground-link-artifacts
          path: experiments/continuous-observation-equivalence/ground-link-artifacts/*.json
          if-no-files-found: error

  ground-link-verifier:
    needs: [certificate-producer, ground-link-producer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 3b57adcc2baaaa7e56e4bab943946f4e87e95c65
          path: external/E-CPU
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Receive original certificates
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Receive produced Ground identity links
        uses: actions/download-artifact@v4
        with:
          name: coe004-ground-link-artifacts
          path: experiments/continuous-observation-equivalence/received-ground-links
      - name: Independent reconstruction with pinned E-CPU contracts
        working-directory: experiments/continuous-observation-equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/external/E-CPU
        run: python ground_binding_verifier.py received-certificates received-ground-links --ecpu-dir "${{ github.workspace }}/external/E-CPU" --output independent-ground-link-report.json
      - name: Adversarial Ground, observer and contract substitution tests
        working-directory: experiments/continuous-observation-equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/external/E-CPU
        run: python -m unittest discover -s . -p 'test_ground_binding.py' -v
      - name: Retain independently reconstructed Ground link report
        uses: actions/upload-artifact@v4
        with:
          name: coe004-ground-link-verifier-report
          path: experiments/continuous-observation-equivalence/independent-ground-link-report.json
          if-no-files-found: error

  lean-certificate-replay:
    needs: certificate-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build independently checked Lean source with pinned toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/continuous-observation-equivalence/lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Receive exact Python producer certificates for Lean replay
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Verify canonical transport, source manifest and adversarial generator
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_lean_certificate_bridge -v
      - name: Translate only pinned certificate bytes into literal Lean inputs
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python emit_lean_certificates.py received-certificates lean/GeneratedCertificateProofs.lean --manifest lean/lean-replay-manifest.json
      - name: Kernel-reduce all five exact rational source certificates
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean GeneratedCertificateProofs.lean | tee lean-certificates-proof-output.txt
          for name in identity relu_identity zero triangular_bump rescaled_bump; do
            grep -Fq "theorem $name""_arith_verified" GeneratedCertificateProofs.lean
          done
          if grep -Eq 'sorryAx|error:' lean-certificates-proof-output.txt; then
            cat lean-certificates-proof-output.txt
            exit 1
          fi
      - name: Test untrusted string-only wire transport
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_lean_wire -v
      - name: Transport original string tokens separately from rational literals
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python emit_lean_wire.py received-certificates lean/GeneratedWireProofs.lean --manifest lean/lean-wire-replay-manifest.json
      - name: Kernel-decode wire tokens and prove equality to original five typed certificates
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean -o .lake/build/lib/lean/GeneratedCertificateProofs.olean GeneratedCertificateProofs.lean > lean-certificate-olean-output.txt
          lake env lean GeneratedWireProofs.lean | tee lean-wire-token-proof-output.txt
          for name in identity relu_identity zero triangular_bump rescaled_bump; do
            grep -Fq "'COE012.${name}_wire_decoded' depends on axioms:" lean-wire-token-proof-output.txt
            grep -Fq "'COE012.${name}_wire_verified' depends on axioms:" lean-wire-token-proof-output.txt
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' lean-wire-token-proof-output.txt; then
            cat lean-wire-token-proof-output.txt
            exit 1
          fi
      - name: Test direct raw JSON byte transport without Python JSON interpretation
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_lean_json_bytes -v
      - name: Carry complete original canonical JSON file bytes into Lean
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python emit_lean_json_bytes.py received-certificates lean/GeneratedJSONProofs.lean --manifest lean/lean-json-replay-manifest.json
      - name: Kernel-parse entire original JSON structure for all five certificates
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean -o .lake/build/lib/lean/GeneratedWireProofs.olean GeneratedWireProofs.lean > lean-wire-olean-output.txt
          lake env lean GeneratedJSONProofs.lean | tee lean-json-byte-proof-output.txt
          for name in identity relu_identity zero triangular_bump rescaled_bump; do
            grep -Fq "'COE013.${name}_json_wire' does not depend on any axioms" lean-json-byte-proof-output.txt
            grep -Fq "'COE013.${name}_json_admitted' depends on axioms: [propext, Classical.choice, Quot.sound]" lean-json-byte-proof-output.txt
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' lean-json-byte-proof-output.txt; then
            cat lean-json-byte-proof-output.txt
            exit 1
          fi
      - name: Verify pure Lean SHA-256 against five standard reference vectors
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean --run COE014Vectors.lean | tee sha256-reference-vectors.txt
          for name in empty abc fox multi thousand; do
            grep -Fq "SHA-256 ${name}: PASS" sha256-reference-vectors.txt
          done
      - name: Generate raw-network hash and adversarial mutation replay
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python emit_lean_hash_replay.py received-certificates lean/GeneratedHashReplay.lean
      - name: Independently reconstruct pinned SHA-256 on five original networks
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          lake env lean -o .lake/build/lib/lean/GeneratedJSONProofs.olean GeneratedJSONProofs.lean > lean-json-olean-output.txt
          lake env lean --run GeneratedHashReplay.lean | tee sha256-pinned-network-replay.txt
          for name in identity relu_identity zero triangular_bump rescaled_bump; do
            grep -Fq "COE-014 ${name}: original network SHA-256 and pin PASS" sha256-pinned-network-replay.txt
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' sha256-pinned-network-replay.txt; then
            cat sha256-pinned-network-replay.txt
            exit 1
          fi
      - name: Require kernel rejection of malformed duplicate-key JSON proof
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          if lake env lean COE013Invalid.lean > invalid-json-byte-proof.txt 2>&1; then
            echo "ERROR: Lean accepted duplicate JSON keys"
            exit 1
          fi
          cat invalid-json-byte-proof.txt
          grep -Fq 'Tactic `decide` proved that the proposition' invalid-json-byte-proof.txt
          grep -Fq 'parseEnvelope duplicateKey ≠ none' invalid-json-byte-proof.txt
          grep -Fq 'is false' invalid-json-byte-proof.txt
      - name: Require Lean kernel rejection of noncanonical rational wire admission
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          if lake env lean COE012WireInvalid.lean > invalid-wire-token.txt 2>&1; then
            echo "ERROR: Lean accepted an unreduced wire fraction"
            exit 1
          fi
          cat invalid-wire-token.txt
          grep -Fq 'Tactic `decide` proved that the proposition' invalid-wire-token.txt
          grep -Fq 'acceptWire unreduced = true' invalid-wire-token.txt
          grep -Fq 'is false' invalid-wire-token.txt
      - name: Construct negative certificates without altering source network hashes
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python make_lean_negative_certificates.py received-certificates lean-negative-artifacts
          for case in hidden-root wrong-slope cover-gap; do
            python emit_lean_certificates.py "lean-negative-artifacts/$case" "lean/Negative-$case.lean"
          done
      - name: Require Lean kernel rejection of all three corrupt certificate claims
        working-directory: experiments/continuous-observation-equivalence/lean
        run: |
          for case in hidden-root wrong-slope cover-gap; do
            if lake env lean "Negative-$case.lean" > "negative-$case-rejection.txt" 2>&1; then
              echo "ERROR: Lean accepted corrupted $case certificate."
              exit 1
            fi
            grep -Eq 'error:|unsolved goals' "negative-$case-rejection.txt"
          done
      - name: Retain transported source identities and independent Lean results
        uses: actions/upload-artifact@v4
        with:
          name: coe007-lean-certificate-replay
          path: |
            experiments/continuous-observation-equivalence/lean/lean-replay-manifest.json
            experiments/continuous-observation-equivalence/lean/GeneratedCertificateProofs.lean
            experiments/continuous-observation-equivalence/lean/lean-certificates-proof-output.txt
            experiments/continuous-observation-equivalence/lean/lean-wire-replay-manifest.json
            experiments/continuous-observation-equivalence/lean/GeneratedWireProofs.lean
            experiments/continuous-observation-equivalence/lean/lean-certificate-olean-output.txt
            experiments/continuous-observation-equivalence/lean/lean-wire-token-proof-output.txt
            experiments/continuous-observation-equivalence/lean/lean-json-replay-manifest.json
            experiments/continuous-observation-equivalence/lean/GeneratedJSONProofs.lean
            experiments/continuous-observation-equivalence/lean/lean-json-byte-proof-output.txt
            experiments/continuous-observation-equivalence/lean/sha256-reference-vectors.txt
            experiments/continuous-observation-equivalence/lean/GeneratedHashReplay.lean
            experiments/continuous-observation-equivalence/lean/lean-json-olean-output.txt
            experiments/continuous-observation-equivalence/lean/sha256-pinned-network-replay.txt
            experiments/continuous-observation-equivalence/lean/invalid-json-byte-proof.txt
            experiments/continuous-observation-equivalence/lean/lean-wire-olean-output.txt
            experiments/continuous-observation-equivalence/lean/invalid-wire-token.txt
            experiments/continuous-observation-equivalence/lean/negative-*-rejection.txt
          if-no-files-found: error

  same-source-evidence-convergence:
    # One CI run binds four independent verdicts to the same original files.
    # Previous jobs must succeed; this stage is NOT proof of external identity
    # and deliberately cannot convert public demo signatures into Ground authority.
    needs: [certificate-producer, signed-manifest-producer, signed-manifest-verifier,
            certificate-checker, go-certificate-checker, lean-certificate-replay]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: Receive exact original untrusted certificate files
        uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - name: Receive untrusted signed source manifest
        uses: actions/download-artifact@v4
        with:
          name: coe015-untrusted-signed-manifest
          path: experiments/continuous-observation-equivalence/received-authority-claims
      - name: Receive completed independent Lean kernel evidence from this workflow
        uses: actions/download-artifact@v4
        with:
          name: coe007-lean-certificate-replay
          path: experiments/continuous-observation-equivalence/joined-lean-evidence
      - name: Receive separately verified Python mathematical evidence
        uses: actions/download-artifact@v4
        with:
          name: coe002-independent-checker-report
          path: experiments/continuous-observation-equivalence/joined-python-evidence
      - name: Receive separately verified Go mathematical evidence
        uses: actions/download-artifact@v4
        with:
          name: coe003-go-independent-checker-report
          path: experiments/continuous-observation-equivalence/joined-go-evidence
      - name: Re-verify Ed25519 under a local receiver-controlled TEST policy
        working-directory: experiments/continuous-observation-equivalence/coe015_auth
        run: |
          go run ./cmd/verify \
            -policy demo-policy.json \
            -signed ../received-authority-claims/signed-manifest.json \
            -certs ../received-certificates \
            -allow-demo \
            -report ../joined-authority-receipt.json
      - name: Adversarially test exact-byte cross-evidence convergence
        working-directory: experiments/continuous-observation-equivalence
        run: python -m unittest test_coe016_binding -v
      - name: Reject divergent original bytes, semantics, pins or proof records
        working-directory: experiments/continuous-observation-equivalence
        run: |
          python coe016_binding.py \
            --certs received-certificates \
            --authority joined-authority-receipt.json \
            --lean joined-lean-evidence/lean-json-replay-manifest.json \
            --python joined-python-evidence/independent-certificate-report.json \
            --go joined-go-evidence/go-independent-check-report.json \
            --lean-log joined-lean-evidence/sha256-pinned-network-replay.txt \
            --output coe016-bound-source-receipt.json
      - name: Retain explicitly non-admitting cross-evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: coe016-test-only-cross-evidence-receipt
          path: experiments/continuous-observation-equivalence/coe016-bound-source-receipt.json
          if-no-files-found: error

  verifier-attestation-producer:
    # Public test-key signer receives the finished COE-016 join and original files.
    needs: [same-source-evidence-convergence, certificate-producer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - uses: actions/download-artifact@v4
        with:
          name: coe016-test-only-cross-evidence-receipt
          path: experiments/continuous-observation-equivalence/received-coe016
      - name: Produce PUBLIC TEST-ONLY verifier-key signature claims
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: |
          go run ./cmd/demo \
            ../received-coe016/coe016-bound-source-receipt.json \
            ../received-certificates \
            ../untrusted-verifier-attestation
      - name: Transfer untrusted signed verifier receipt
        uses: actions/upload-artifact@v4
        with:
          name: coe017-public-demo-untrusted-verifier-attestation
          path: experiments/continuous-observation-equivalence/untrusted-verifier-attestation/signed-verifier-receipt.json
          if-no-files-found: error

  verifier-attestation-receiver:
    # A separately hosted receiver independently chooses policy and replay
    # checkpoint, recomputes original-byte hashes, and rejects stale identities.
    needs: [same-source-evidence-convergence, certificate-producer, verifier-attestation-producer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - uses: actions/download-artifact@v4
        with:
          name: coe016-test-only-cross-evidence-receipt
          path: experiments/continuous-observation-equivalence/received-coe016
      - uses: actions/download-artifact@v4
        with:
          name: coe017-public-demo-untrusted-verifier-attestation
          path: experiments/continuous-observation-equivalence/received-verifier-attestation
      - name: Adversarially test signer possession, quorum, rotation, revocation and replay
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: go test -count=1 -v ./...
      - name: Initialize independent receiver-owned demonstration state
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: cp demo-state.json receiver-state.json
      - name: Reject PUBLIC demo keys by default
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: |
          if go run ./cmd/verify \
            -policy demo-policy.json \
            -signed ../received-verifier-attestation/signed-verifier-receipt.json \
            -evidence ../received-coe016/coe016-bound-source-receipt.json \
            -certs ../received-certificates \
            -state receiver-state.json -report coe017-receiver-result.json \
            > refusal.txt 2>&1; then
            echo 'ERROR: public test-only verifier keys were accepted by default'
            exit 1
          fi
          grep -Fq 'public demonstration verifier keys are not production identity' refusal.txt
      - name: Verify source and signer identity under receiver-owned test policy
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: |
          go run ./cmd/verify \
            -policy demo-policy.json \
            -signed ../received-verifier-attestation/signed-verifier-receipt.json \
            -evidence ../received-coe016/coe016-bound-source-receipt.json \
            -certs ../received-certificates \
            -state receiver-state.json -report coe017-receiver-result.json \
            -allow-demo
          grep -Fq '"ground_admitted":false' coe017-receiver-result.json
          grep -Fq '"real_world_identity_authenticated":false' coe017-receiver-result.json
          grep -Fq '"key_possession_verified":true' coe017-receiver-result.json
          grep -Fq '"last_sequence":3' receiver-state.json
      - name: Require replay refusal after local state progression
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: |
          if go run ./cmd/verify \
            -policy demo-policy.json \
            -signed ../received-verifier-attestation/signed-verifier-receipt.json \
            -evidence ../received-coe016/coe016-bound-source-receipt.json \
            -certs ../received-certificates \
            -state receiver-state.json -report repeated-receipt.json \
            -allow-demo > replay-refusal.txt 2>&1; then
            echo 'ERROR: repeated verifier receipt was accepted'
            exit 1
          fi
          grep -Fq 'stale/replayed sequence' replay-refusal.txt
      - name: Preserve receiver-scoped key and state observation
        uses: actions/upload-artifact@v4
        with:
          name: coe017-demo-receiver-verifier-evidence
          path: |
            experiments/continuous-observation-equivalence/coe017_attest/coe017-receiver-result.json
            experiments/continuous-observation-equivalence/coe017_attest/receiver-state.json
            experiments/continuous-observation-equivalence/coe017_attest/refusal.txt
            experiments/continuous-observation-equivalence/coe017_attest/replay-refusal.txt
          if-no-files-found: error

  coe018-journal-producer:
    needs: [certificate-producer, same-source-evidence-convergence, verifier-attestation-producer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - uses: actions/download-artifact@v4
        with:
          name: coe016-test-only-cross-evidence-receipt
          path: experiments/continuous-observation-equivalence/received-coe016
      - uses: actions/download-artifact@v4
        with:
          name: coe017-public-demo-untrusted-verifier-attestation
          path: experiments/continuous-observation-equivalence/received-verifier-attestation
      - name: Make untrusted PUBLIC TEST-ONLY signed acceptance, key rotation and revocation
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: |
          go run ./cmd/history-demo \
            ../received-verifier-attestation/signed-verifier-receipt.json \
            ../received-coe016/coe016-bound-source-receipt.json \
            demo-policy.json demo-state.json ../received-certificates \
            ../untrusted-governance-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: coe018-public-demo-untrusted-journal
          path: experiments/continuous-observation-equivalence/untrusted-governance-artifacts/*.json
          if-no-files-found: error

  coe018-receiver-a:
    needs: [coe018-journal-producer, certificate-producer, verifier-attestation-producer, same-source-evidence-convergence]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: coe002-producer-certificates
          path: experiments/continuous-observation-equivalence/received-certificates
      - uses: actions/download-artifact@v4
        with:
          name: coe016-test-only-cross-evidence-receipt
          path: experiments/continuous-observation-equivalence/received-coe016
      - uses: actions/download-artifact@v4
        with:
          name: coe017-public-demo-untrusted-verifier-attestation
          path: experiments/continuous-observation-equivalence/received-verifier-attestation
      - uses: actions/download-artifact@v4
        with:
          name: coe018-public-demo-untrusted-journal
          path: experiments/continuous-observation-equivalence/received-governance
      - name: Test signed history, new-key proofs, revocation, fork and rollback
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: go test -count=1 -v ./history ./cmd/history-demo ./cmd/history-verify
      - name: Refuse public demonstration keys without explicit opt-in
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: |
          if go run ./cmd/history-verify \
            -journal ../received-governance/untrusted-governance-journal.json \
            -signed ../received-verifier-attestation/signed-verifier-receipt.json \
            -evidence ../received-coe016/coe016-bound-source-receipt.json \
            -policy demo-policy.json -state demo-state.json \
            -certs ../received-certificates \
            -expected-anchor ../received-governance/producer-claimed-anchor.json \
            -output receiver-a.json > refused-demo.txt 2>&1; then
            echo 'ERROR: public demo keys silently accepted'
            exit 1
          fi
          grep -Fq 'demo authority refused without opt-in' refused-demo.txt
      - name: Independently reconstruct verified byte-bound authority history
        working-directory: experiments/continuous-observation-equivalence/coe017_attest
        run: |
          go run ./cmd/history-verify \
            -journal ../received-governance/untrusted-governance-journal.json \
            -signed ../received-verifier-attestation/signed-verifier-receipt.json \
            -evidence ../received-coe016/coe016-bound-source-receipt.json \
            -policy demo-policy.json -state demo-state.json \
            -certs ../received-certificates \
            -expected-anchor ../received-governance/producer-claimed-anchor.json \
            -output receiver-a.json -allow-demo
          grep -Fq '"status":"revoked-under-policy"' receiver-a.json
          grep -Fq '"external_anchor_authenticated":false' receiver-a.json
          grep -Fq '"ground_admitted":false' receiver-a.json
          grep -Fq '"real_world_identity_authenticated":false' receiver-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: coe018-receiver-a-reconstruction
          path: experiments/continuous-observation-equivalence/coe017_attest/receiver-a.json
          if-no-files-found: error

  coe018-receiver-b:
    needs: [coe018-journal-producer, certificate-producer, verifier-attestation-producer, same-source-evidence-convergence]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
