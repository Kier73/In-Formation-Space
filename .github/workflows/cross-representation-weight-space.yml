name: Cross-representation weight-space experiment

on:
  push:
    paths:
      - "experiments/cross-representation-weight-space/**"
      - ".github/workflows/cross-representation-weight-space.yml"
  pull_request:
    paths:
      - "experiments/cross-representation-weight-space/**"
      - ".github/workflows/cross-representation-weight-space.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-cross-representation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment and provenance workspace
        uses: actions/checkout@v4

      - name: Check out E-CPU realization at the experiment revision
        uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 623041aff51d69e3d2c59fc15fb2c50e72682048
          path: external/E-CPU

      - name: Check out VGI reference at the experiment revision
        uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ff13ac08bc11420e75fb9654bd713f30859b84af
          path: external/Virtual-Ground-Interpreter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run the cross-representation experiment
        env:
          PYTHONPATH: external/E-CPU:external/Virtual-Ground-Interpreter/virtual_ground_interpreter
        run: >-
          python experiments/cross-representation-weight-space/run_experiment.py
          --output "${{ runner.temp }}/cross-representation-weight-space.json"

      - name: Run E-CPU weight-space tests
        env:
          PYTHONPATH: external/E-CPU
        run: python -m pytest external/E-CPU/tests/test_weight_space.py -q

      - name: Run VGI Boolean subgroup tests
        env:
          PYTHONPATH: external/Virtual-Ground-Interpreter/virtual_ground_interpreter
        run: >-
          python -m unittest discover
          -s external/Virtual-Ground-Interpreter/virtual_ground_interpreter/tests
          -p "test_boolean_subgroup.py" -v

      - name: Upload reproducible experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-representation-weight-space
          path: ${{ runner.temp }}/cross-representation-weight-space.json
          if-no-files-found: warn
