name: Finite observation witness navigation

on:
  pull_request:
    paths:
      - 'bridges/observation-equivalence/**'
      - '.github/workflows/observation-witness-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'bridges/observation-equivalence/**'
      - '.github/workflows/observation-witness-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-witness:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact finite-model counterexamples and prior equivalence regressions
        run: python -m unittest discover -s bridges/observation-equivalence -p 'test_*.py' -v
